# Bindet /tracking.js einmalig in alle Live-Seiten ein (vor </body>).
# Idempotent: Seiten, die tracking.js schon laden, werden uebersprungen.
name: Tracking-Script einbinden
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/tracking-einbinden.yml']
permissions:
  contents: write
jobs:
  einbinden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tracking.js in alle Live-Seiten einbinden
        run: |
          python3 - <<'PYEOF'
          import json, os
          red = {r['source'].lstrip('/') for r in json.load(open('vercel.json')).get('redirects', [])}
          tag = '<script src="/tracking.js" defer></script>'
          n = 0
          for f in sorted(os.listdir('.')):
              if not f.endswith('.html') or f in red:
                  continue
              with open(f, encoding='utf-8', errors='surrogateescape', newline='') as h:
                  s = h.read()
              if '/tracking.js' in s or '</body>' not in s:
                  continue
              i = s.rfind('</body>')
              s = s[:i] + tag + '\n' + s[i:]
              with open(f, 'w', encoding='utf-8', errors='surrogateescape', newline='') as h:
                  h.write(s)
              n += 1
          print('eingebunden in', n, 'Seiten')
          PYEOF
      - name: Commit und Push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          git diff --cached --quiet || git commit -m 'tracking.js in alle Live-Landingpages eingebunden'
          git push
