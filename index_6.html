/* ============================================================
   TAGESBERICHT + WARNFELD
   ============================================================ */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function reportFor(user,date){ return DB.read('daily_reports',[]).find(r=>r.user===user && r.date===date); }
function lastWorkday(){ const d=new Date(); do{ d.setDate(d.getDate()-1); }while(d.getDay()===0||d.getDay()===6); return d.toISOString().slice(0,10); }
function maHasReportToday(){ return !!reportFor('Mitarbeiter',todayISO()); }
function maMissedReport(){ return !reportFor('Mitarbeiter',lastWorkday()); }
function tagesberichtView(){
  const me=CURRENT_USER||'Chef';
  const reports=DB.read('daily_reports',[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  const todays = reportFor(me==='Chef'?'Mitarbeiter':me, todayISO());
  let form='';
  if(me!=='Chef'){
    const t=reportFor('Mitarbeiter',todayISO());
    form=`<div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">Heutiger Tagesbericht ${t?'<span class="badge b-abschluss">eingetragen ✓</span>':'<span class="badge b-offen">offen</span>'}</h3>
      <p class="muted" style="font-size:12px">Pflicht: Trage täglich ein, was du gemacht hast und wie viele Stunden – sonst erscheint ein Warnhinweis und du wirst beim Schließen erinnert.</p>
      <div class="field"><label>Was hast du heute gemacht?</label><textarea id="dr_txt" style="min-height:90px">${t?esc(t.txt):''}</textarea></div>
      <div class="row" style="align-items:flex-end"><div class="field" style="max-width:160px;margin:0"><label>Stunden gearbeitet</label><input type="number" step="0.5" id="dr_hours" value="${t?t.hours:''}"></div>
      <button class="btn" onclick="saveDailyReport()">${t?'Aktualisieren':'Tagesbericht speichern'}</button></div>
    </div>`;
  } else {
    const missed=maMissedReport();
    form=`<div class="banner ${missed?'alert':''}">${missed?`⚠️ Der Mitarbeiter hat für <b>${fmtDate(lastWorkday())}</b> keinen Tagesbericht abgegeben.`:`✅ Tagesberichte des Mitarbeiters sind aktuell. Heute ${reportFor('Mitarbeiter',todayISO())?'bereits eingetragen':'noch offen'}.`}</div>`;
  }
  return head('Tagesbericht', me==='Chef'?'Tägliche Berichte des Mitarbeiters (Tätigkeit & Stunden)':'Tägliche Pflicht-Dokumentation')+
    form+`
    <div class="card" style="padding:0;overflow:hidden"><table>
      <thead><tr><th>Datum</th><th>Mitarbeiter</th><th>Stunden</th><th>Tätigkeit</th></tr></thead>
      <tbody>${reports.map(r=>`<tr><td>${fmtDate(r.date)}</td><td>${esc(r.user)}</td><td>${r.hours} h</td><td>${esc(r.txt)}</td></tr>`).join('')||'<tr><td colspan="4"><div class="empty">Noch keine Berichte</div></td></tr>'}</tbody>
    </table></div>`;
}
function afterTagesbericht(){}
function saveDailyReport(){
  const txt=document.getElementById('dr_txt').value.trim();
  const hours=document.getElementById('dr_hours').value;
  if(!txt||!hours){ alert('Bitte Tätigkeit und Stunden angeben.'); return; }
  const reps=DB.read('daily_reports',[]); const ex=reps.find(r=>r.user==='Mitarbeiter'&&r.date===todayISO());
  if(ex){ ex.txt=txt; ex.hours=+hours; } else reps.push({date:todayISO(),user:'Mitarbeiter',txt,hours:+hours});
  DB.write('daily_reports',reps);
  hideCenterWarning(); alert('Tagesbericht gespeichert.'); render();
}
/* Zentrales Warnfeld */
function showCenterWarning(html){
  let el=document.getElementById('centerWarn');
  if(!el){ el=document.createElement('div'); el.id='centerWarn'; el.className='center-warn'; document.body.appendChild(el); }

function hideCenterWarning(){ const el=document.getElementById('centerWarn'); if(el) el.style.display='none'; }
function checkDailyWarning(){
  if((CURRENT_USER||'')!=='Mitarbeiter'){ hideCenterWarning(); return; }
  if(maMissedReport()){
    showCenterWarning(`<div class="center-warn-box">
      <div style="font-size:40px">⚠️</div>
      <h2 style="margin:6px 0">Tagesbericht fehlt!</h2>

      <div class="flexbtns" style="justify-content:center">
        <button class="btn" onclick="hideCenterWarning();go('tagesbericht')">Jetzt nachtragen</button>
        <button class="btn ghost" onclick="hideCenterWarning()">Später</button>
      </div></div>`);

}

/* ----- Cockpit-Charts ----- */
function ckSpark(vals,color){
  const w=94,h=32,max=Math.max(...vals),min=Math.min(...vals),rng=(max-min)||1;
  const pts=vals.map((v,i)=>`${((i/(vals.length-1))*w).toFixed(1)},${(h-3-((v-min)/rng)*(h-7)).toFixed(1)}`).join(' ');
  return `<svg class="ck-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polygon fill="${color}" opacity=".09" points="0,${h} ${pts} ${w},${h}"/><polyline fill="none" stroke="${color}" stroke-width="2" points="${pts}"/></svg>`;
}
function ckTrend(s){ return [0,1,2,3,4,5,6,7].map(i=> 3 + Math.abs(Math.sin(s*0.7+i))*4 + i*0.55 ); }
function ckDonut(segs){
  const total=segs.reduce((a,s)=>a+s.v,0)||1; let acc=0;
  const arcs=segs.filter(s=>s.v>0).map(s=>{const len=s.v/total*100;const doff=25-acc;acc+=len;return `<circle cx="21" cy="21" r="15.915" fill="none" stroke="${s.color}" stroke-width="5" stroke-dasharray="${len.toFixed(2)} ${(100-len).toFixed(2)}" stroke-dashoffset="${doff.toFixed(2)}"/>`;}).join('');
  return `<svg width="130" height="130" viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.915" fill="none" stroke="var(--panel2)" stroke-width="5"/>${arcs}<text x="21" y="20.5" text-anchor="middle" font-size="7" font-weight="800" fill="var(--text)">${total}</text><text x="21" y="26" text-anchor="middle" font-size="2.7" fill="var(--muted)">Kontakte</text></svg>`;
}
function ckAgg(){
  const pipes=psGet(); let imp=0,clicks=0,conv=0,spend=0,open=0,weighted=0,won=0,wonVal=0,sumW=0;
  const dist={hot:0,warm:0,lau:0,cold:0};
  const order=[['neu','Neu'],['kontaktiert','Kontaktiert'],['nurturing','Nurturing'],['termin','Termin/Call'],['angebot','Angebot'],['gewonnen','Gewonnen']];
  const fmap=Object.fromEntries(order.map(o=>[o[0],0]));
  pipes.forEach(p=>{const g=p.google||{};imp+=g.imp||0;clicks+=g.clicks||0;conv+=g.conv||0;spend+=g.spend||0;
    const s=psStats(p);open+=s.open;weighted+=s.weighted;won+=s.won;wonVal+=s.wonValue;
    (p.contacts||[]).forEach(c=>{ if(c.stage in fmap) fmap[c.stage]++; if(c.stage!=='gewonnen'&&c.stage!=='verloren'){const w=psWarmthFull(c,p);dist[w.cls]++;sumW+=w.score;} });
  });
  return {imp,clicks,conv,spend,open,weighted,won,wonVal,dist,funnel:order.map(o=>({lbl:o[1],n:fmap[o[0]]})),ctr:imp?clicks/imp*100:0,cvr:clicks?conv/clicks*100:0,avgW:open?Math.round(sumW/open):0};
}

/* KI-Wärme: bewertet Reaktionsfreude & Aktualität eines Kontakts (0–100) */
function psWarmth(ct){
  let s=0;
  // Aktualität der letzten Antwort (max 40)
  if(ct.lastReply){ const d=(Date.now()-ct.lastReply)/86400000; s+= d<=1?40 : d<=3?32 : d<=7?22 : d<=14?12 : 5; }
  // Antworten (max 30) & Öffnungen (max 15)
  s+=Math.min(30,(ct.replies||0)*8);
  s+=Math.min(15,(ct.opens||0)*2);
  // Trichter-Fortschritt (max 15) – abhängig von Stufe wird in psScoreWithStage ergänzt
  return Math.round(Math.min(100,s));
}
function psWarmthFull(ct,pipe){
  let s=psWarmth(ct);
  const st=(pipe.stages||[]).find(x=>x.id===ct.stage);
  if(st) s=Math.round(Math.min(100, s + (st.prob/100)*15));
  const cls = s>=70?'hot':s>=45?'warm':s>=20?'lau':'cold';
  const meta={hot:{e:'🔥',t:'Heiß'},warm:{e:'🟠',t:'Warm'},lau:{e:'🟡',t:'Lau'},cold:{e:'🧊',t:'Kalt'}}[cls];
  return {score:s,cls,emoji:meta.e,label:meta.t};
}
function psStats(pipe){
  const open=(pipe.contacts||[]).filter(c=>c.stage!=='gewonnen'&&c.stage!=='verloren');
  const won=(pipe.contacts||[]).filter(c=>c.stage==='gewonnen');
  const stageProb=id=>{const st=(pipe.stages||[]).find(x=>x.id===id);return st?st.prob:0;};
  const weighted=open.reduce((a,c)=>a+(c.value||0)*stageProb(c.stage)/100,0);
  const g=pipe.google||{};
  const ctr=g.imp? (g.clicks/g.imp*100):0;
  const cvr=g.clicks? (g.conv/g.clicks*100):0;
  const cpl=g.conv? (g.spend/g.conv):0;
  const avgW=open.length? Math.round(open.reduce((a,c)=>a+psWarmthFull(c,pipe).score,0)/open.length):0;
  return {open:open.length,won:won.length,total:(pipe.contacts||[]).length,weighted:Math.round(weighted),wonValue:won.reduce((a,c)=>a+(c.value||0),0),ctr,cvr,cpl,avgW};
}
function psLog(c,ico,txt){ c.history=c.history||[]; c.history.unshift({t:Date.now(),ico,txt}); }
function psRunAuto(p,c,stageId){
  const a=(p.autos||{})[stageId]; if(!a||!a.active) return false;
  const st=(p.stages||[]).find(s=>s.id===stageId); const lbl=st?st.label:stageId;
  if(a.note) psLog(c,'⚡','Automation ('+lbl+'): '+a.note);
  if(a.subj) psLog(c,'✉️','Auto-Mail „'+a.subj+'" ausgelöst'+(c.email?(' an '+c.email):''));
  return true;
}
/* Trichter-Auswertung: Anzahl je Stufe, Drop-off, Conversion */
function psFunnel(p){
  const order=(p.stages||[]).filter(s=>s.id!=='verloren');
  const rows=order.map(s=>({...s,n:(p.contacts||[]).filter(c=>c.stage===s.id).length}));
  const total=(p.contacts||[]).length;
  const lost=(p.contacts||[]).filter(c=>c.stage==='verloren').length;
  const won=(p.contacts||[]).filter(c=>c.stage==='gewonnen').length;
  return {rows,total,lost,won,convRate: total? (won/total*100):0, lossRate: total? (lost/total*100):0};
}

   <div class="banner alert">⚠️ Vereinfachte Orientierung, <b>keine Steuerberatung</b>. Gewerbesteuer, Vorsteuer-Abzug und Freibeträge bitte mit dem Steuerberater klären.</div>

function _finVal(k){ const el=document.getElementById('fin_'+k); return el?(parseFloat(el.value)||0):0; }
function updateFinanzen(){
  const host=document.getElementById('finResult'); if(!host)return;
  const umsatz=_finVal('umsatz');
  const kosten=_finVal('miete')+_finVal('personal')+_finVal('google')+_finVal('marketing')+_finVal('gehalt')+_finVal('sonstiges');
  const mwst=umsatz*0.19;
  const gewinn=umsatz-kosten;
  const kst=gewinn>0?gewinn*0.15:0;
  const soli=document.getElementById('fin_soli')&&document.getElementById('fin_soli').checked?kst*0.055:0;
  const netto=gewinn-kst-soli;
  const row=(l,v,opt={})=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)${opt.strong?';font-weight:800;font-size:17px':''}"><span>${l}</span><span style="${opt.col?'color:'+opt.col:''}">${eur(Math.round(v))}</span></div>`;
  host.innerHTML=
    row('Umsatz (netto)',umsatz)+
    row('+ 19% MwSt',mwst,{col:'var(--muted)'})+
    row('Umsatz (brutto)',umsatz+mwst,{col:'var(--muted)'})+
    row('− Kosten gesamt',kosten,{col:'#fca5a5'})+
    row('= Gewinn vor Steuer',gewinn,{col:gewinn>=0?'var(--accent2)':'#fca5a5'})+
    row('− Körperschaftsteuer (15%)',kst,{col:'#fca5a5'})+
    (soli?row('− Solidaritätszuschlag (5,5%)',soli,{col:'#fca5a5'}):'')+
    row('= Gewinn nach Steuer',netto,{strong:true,col:netto>=0?'var(--accent2)':'#fca5a5'})+
    `<p class="muted" style="font-size:11px;margin-top:10px">Hinweis: Die MwSt ist durchlaufend (Zahllast ans Finanzamt abzüglich gezahlter Vorsteuer) und kein Gewinn. Der „Gewinn nach Steuer" ist eine grobe Orientierung.</p>`;
}
function saveFinanzen(){
  if(roGuard&&roGuard())return;
  DB.write('finanzen',{umsatz:_finVal('umsatz'),miete:_finVal('miete'),personal:_finVal('personal'),google:_finVal('google'),marketing:_finVal('marketing'),gehalt:_finVal('gehalt'),sonstiges:_finVal('sonstiges'),soli:document.getElementById('fin_soli').checked});
  alert('Finanzdaten gespeichert.');
}

  {id:'mpu_beratung',label:'🎓 MPU-Beratung',source:'deals',stages:[
    {id:'anfrage',label:'Anfrage',prob:10,cls:'b-neu'},
    {id:'erstgespraech',label:'Erstgespräch',prob:30,cls:'b-kontakt'},
    {id:'angebot',label:'Angebot',prob:55,cls:'b-interesse'},
    {id:'gebucht',label:'Gebucht',prob:80,cls:'b-offen'},
    {id:'abgeschlossen',label:'Abgeschlossen',prob:100,cls:'b-abschluss'},
    {id:'abgesprungen',label:'Abgesprungen',prob:0,cls:'b-kein'},
  ]},
  {id:'mpu_plattform',label:'💻 MPU-Plattform',source:'deals',stages:[
    {id:'lead',label:'Lead',prob:10,cls:'b-neu'},
    {id:'registriert',label:'Registriert',prob:30,cls:'b-kontakt'},
    {id:'onboarding',label:'Onboarding',prob:55,cls:'b-interesse'},
    {id:'aktiv',label:'Aktiv',prob:80,cls:'b-offen'},
    {id:'abschluss',label:'Abschluss',prob:100,cls:'b-abschluss'},
    {id:'abgesprungen',label:'Abgesprungen',prob:0,cls:'b-kein'},
  ]},
];
const PIPELINE_BY=Object.fromEntries(PIPELINES.map(p=>[p.id,p]));
let CURRENT_PIPELINE='maschinenbau';
function pipelineItems(pl){ return pl.source==='contacts'?DB.read('contacts',[]):DB.read('deals',[]).filter(d=>d.pipeline===pl.id); }
function itemStageId(pl,item){ return pl.source==='contacts'?normStage(item.status):item.stage; }
function setItemStage(pl,id,stage){
  if(pl.source==='contacts'){ const c=DB.read('contacts',[]); const x=c.find(v=>v.id===id); if(x){x.status=stage;DB.write('contacts',c);} }
  else { const d=DB.read('deals',[]); const x=d.find(v=>v.id===id); if(x){x.stage=stage;DB.write('deals',d);} }
}
function stageAutosKey(plId){ return plId==='maschinenbau'?'stage_autos':'stage_autos_'+plId; }
function defaultFunnelAutos(plId){
  const seedTxt={
    mpu_beratung:{ erstgespraech:{frage:'Darf ich Ihnen unverbindlich zeigen, wie Ihre MPU-Vorbereitung konkret abläuft?',pdf:'Ablauf-und-Kosten.pdf'},
      angebot:{frage:'Ich habe Ihnen ein passendes Paket zusammengestellt – sollen wir den Starttermin festlegen?',pdf:'Infobroschuere-MPU.pdf'},
      gebucht:{frage:'Willkommen! Welche Unterlagen bringen Sie zum ersten Termin mit?',pdf:''} },
    mpu_plattform:{ registriert:{frage:'Schön, dass Sie dabei sind! Sollen wir Ihr Profil in 5 Minuten gemeinsam einrichten?',pdf:''},
      onboarding:{frage:'Brauchen Sie Hilfe beim ersten Abstinenznachweis-Upload?',pdf:'Ablauf-und-Kosten.pdf'},
      aktiv:{frage:'Wie läuft es? Möchten Sie einen festen Erinnerungs-Rhythmus aktivieren?',pdf:''} },
  };
  const pl=PIPELINE_BY[plId]; const o={};
  pl.stages.forEach(s=>{ const pre=(seedTxt[plId]||{})[s.id]||{}; o[s.id]={active:!!pre.frage,note:'',subj:'',body:'',frage:pre.frage||'',pdf:pre.pdf||''}; });
  return o;
}
function getFunnelAutos(plId){ const saved=DB.read(stageAutosKey(plId),null); if(saved)return saved; return plId==='maschinenbau'?defaultStageAutos():defaultFunnelAutos(plId); }
function runFunnelAutomation(pl,itemId,stage){
  const auto=getFunnelAutos(pl.id)[stage]; if(!auto||!auto.active)return false;
  const key=pl.source==='contacts'?'contacts':'deals';
  const items=DB.read(key,[]); const x=items.find(v=>v.id===itemId); if(!x)return false;
  const stLabel=(pl.stages.find(s=>s.id===stage)||{}).label||stage;
  x.notes=x.notes||[];
  let txt='⚡ Automation ('+stLabel+')';
  if(auto.note) txt+=': '+auto.note;
  if(auto.frage) txt+=' · 💬 gesendet: „'+auto.frage+'"';
  if(auto.pdf) txt+=' · 📎 '+auto.pdf;
  x.notes.push({t:Date.now(),txt,erreicht:true});
  DB.write(key,items);
  logActivity('stage',pl.source,itemId,(pl.source==='contacts'?x.firma:x.name),txt);
  if(pl.source==='contacts' && (auto.subj||auto.frage)){
    const mails=DB.read('mb_mails',[]); mails.unshift({id:uid(),from:'Ihr Vertrieb',email:x.email||'',subj:auto.subj||'Nachricht',body:(auto.frage?auto.frage+'\n\n':'')+(auto.body||''),date:Date.now(),read:true,dir:'out'}); DB.write('mb_mails',mails);
  }
  return true;
}

function funnelBoardView(){
  const pl=PIPELINE_BY[CURRENT_PIPELINE]||PIPELINES[0];
  const items=pipelineItems(pl);
  const openIds=pl.stages.filter(s=>s.prob>0&&s.prob<100).map(s=>s.id);
  const offen=items.filter(x=>openIds.includes(itemStageId(pl,x)));
  const offenWert=offen.reduce((s,x)=>s+(x.value||0),0);
  const forecast=offen.reduce((s,x)=>{const st=pl.stages.find(z=>z.id===itemStageId(pl,x));return s+(x.value||0)*(st?st.prob:0)/100;},0);
  const wonStage=pl.stages.find(s=>s.prob===100);
  const wonWert=items.filter(x=>itemStageId(pl,x)===(wonStage&&wonStage.id)).reduce((s,x)=>s+(x.value||0),0);
  const selector=PIPELINES.map(p=>`<button class="btn ${p.id===pl.id?'':'gray'} sm" onclick="switchPipeline('${p.id}')">${p.label}</button>`).join(' ');
  const cols=pl.stages.map((st,stIdx)=>{
    const inSt=items.filter(x=>itemStageId(pl,x)===st.id);
    const sum=inSt.reduce((a,x)=>a+(x.value||0),0);
    const prevSt=pl.stages[stIdx-1], nextSt=pl.stages[stIdx+1];
    const cards=inSt.map(x=>{
      const name=pl.source==='contacts'?x.firma:x.name;
      const sub=pl.source==='contacts'?(x.ansprech||x.stadt||''):(x.tel||'');
      const due=x.wiedervorlage?`<div class="due">⏰ ${fmtDate(x.wiedervorlage)}</div>`:'';
      const moveBtns=RO?'':`<div class="stagebtns">${prevSt?`<button class="btn sm gray" onclick="event.stopPropagation();moveFunnelItem('${x.id}','${prevSt.id}')">← ${esc(prevSt.label)}</button>`:''}${nextSt?`<button class="btn sm" onclick="event.stopPropagation();moveFunnelItem('${x.id}','${nextSt.id}')">${esc(nextSt.label)} →</button>`:''}</div>`;
      return `<div class="deal" ${RO?'':'draggable="true"'} ondragstart="funnelDragStart(event,'${x.id}')" ondragend="funnelDragEnd(event)" onclick="openFunnelItem('${x.id}')">
        <div class="f">${esc(name||'(ohne Name)')}</div><div class="a">${esc(sub)}</div>
        ${x.value?`<div class="v">${eur(x.value)}</div>`:''}${due}${moveBtns}</div>`;
    }).join('')||'<div class="muted" style="font-size:11px;text-align:center;padding:10px">leer</div>';
    return `<div class="col" ondragover="MB.allowDrop(event)" ondragleave="MB.dragLeave(event)" ondrop="funnelDrop(event,'${st.id}')">
      <div class="col-head"><div class="t"><span><span class="stagedot" style="background:var(--accent2)"></span> ${st.label}</span><span class="chip" style="font-size:10px">${st.prob}%</span></div><div class="s">${inSt.length} · ${eur(sum)}</div></div>

async function openPdfTemplate(key,id){
  const p=DB.read(key,[]).find(x=>x.id===id);
  if(!p||!p.data){ toast('Für diese Datei liegt kein Inhalt vor (nur Platzhalter).',true); return; }
  try{
    const res=await fetch(p.data);
    const blob=await res.blob();
    const url=URL.createObjectURL(blob);
    window.open(url,'_blank');
  }catch(e){ toast('Datei konnte nicht geöffnet werden.',true); }
}
function uploadPdfTemplate(key){
  openModal(`<div class="modal-head"><h2>PDF hochladen</h2><button class="x" onclick="closeModal()">×</button></div>

}
function doUploadPdf(key){
  const f=document.getElementById('pdfFile'); if(!f.files[0]){alert('Bitte Datei wählen.');return;}
  const file=f.files[0]; const r=new FileReader();
  r.onload=()=>{ const lib=DB.read(key,[]); lib.push({id:uid(),name:file.name,date:Date.now(),data:r.result});
    try{ DB.write(key,lib); closeModal(); render(); }catch(e){ alert('Datei zu groß für lokalen Speicher.'); } };
  r.readAsDataURL(file);
}

function doGlobalSearch(q){
  const host=document.getElementById('searchResults'); if(!host)return;
  q=(q||'').trim().toLowerCase();
  if(!q){ host.style.display='none'; return; }
  const res=[];
  DB.read('contacts',[]).forEach(c=>{ if((c.firma+' '+(c.ansprech||'')).toLowerCase().includes(q)) res.push({ty:'Kontakt',name:c.firma,act:`openEntity('contact','${c.id}')`}); });
  DB.read('deals',[]).forEach(d=>{ if((d.name||'').toLowerCase().includes(q)) res.push({ty:'Deal · '+(PIPELINE_BY[d.pipeline]?PIPELINE_BY[d.pipeline].label:''),name:d.name,act:`openEntity('deal','${d.id}')`}); });
  DB.read('mpu_clients',[]).forEach(c=>{ if(c.name.toLowerCase().includes(q)) res.push({ty:'MPU-Kunde',name:c.name,act:`openEntity('client','${c.id}')`}); });
  DB.read('mb_leads',[]).forEach(l=>{ if((l.firma||'').toLowerCase().includes(q)) res.push({ty:'Google-Lead',name:l.firma,act:`openEntity('mblead','${l.id}')`}); });
  DB.read('mpu_leads',[]).forEach(l=>{ if((l.name||'').toLowerCase().includes(q)) res.push({ty:'MPU-Lead',name:l.name,act:`openEntity('mpulead','${l.id}')`}); });
  host.innerHTML=res.length?res.slice(0,20).map(r=>`<div class="sr" onmousedown="${r.act}"><b>${esc(r.name)}</b> <span class="ty">${esc(r.ty)}</span></div>`).join(''):'<div class="sr"><span class="muted">Keine Treffer</span></div>';
  host.style.display='block';
}
function hideSearch(){ const h=document.getElementById('searchResults'); if(h)h.style.display='none'; }
function openEntity(type,id){
  hideSearch(); const gs=document.getElementById('globalSearch'); if(gs)gs.value='';
  if(type==='contact'){ goTo('mb','contacts'); setTimeout(()=>MB.openContact(id),40); }
  else if(type==='deal'){ const d=DB.read('deals',[]).find(x=>x.id===id); if(!d)return; CURRENT_PIPELINE=d.pipeline; goTo('mpu','funnels'); setTimeout(()=>openDeal(id),40); }
  else if(type==='client'){ goTo('mpu','clients'); setTimeout(()=>MPU.openClient(id),40); }
  else if(type==='mblead'){ goTo('mb','leads'); }
  else if(type==='mpulead'){ goTo('mpu','mpu_leads'); }
}

function bellItems(){
  const today=todayISO(); const items=[];
  allTasks().filter(t=>!t.done&&t.due&&t.due<=today).forEach(t=>items.push({txt:'⏰ Aufgabe fällig: '+t.txt,act:`goTo('mb','aufgaben')`}));
  DB.read('contacts',[]).filter(c=>c.wiedervorlage&&c.wiedervorlage<=today).forEach(c=>items.push({txt:'📞 Wiedervorlage: '+c.firma,act:`openEntity('contact','${c.id}')`}));
  const gl=unhandledLeads('mb_leads'); if(gl) items.push({txt:'🔴 '+gl+' neue Google-Lead(s)',act:`goTo('mb','leads')`});
  const ml=unhandledLeads('mpu_leads'); if(ml) items.push({txt:'🔴 '+ml+' neue MPU-Lead(s)',act:`goTo('mpu','mpu_leads')`});
  return items;
}
function updateBell(){ const items=bellItems(); const cnt=document.getElementById('bellCount'); if(!cnt)return; if(items.length){ cnt.textContent=items.length; cnt.style.display='block'; } else cnt.style.display='none'; }
function toggleBell(ev){ ev.stopPropagation(); const p=document.getElementById('bellPanel'); const items=bellItems();
  p.innerHTML=items.length?items.map(i=>`<div class="bi" onclick="${i.act};document.getElementById('bellPanel').style.display='none'">${esc(i.txt)}</div>`).join(''):'<div class="bi"><span class="muted">Nichts Offenes 🎉</span></div>';

}

/* Beleg als echtes PDF (jsPDF) erzeugen und Base64 zurückgeben. */
function belegPdfBase64(d){
  const JS=(window.jspdf&&window.jspdf.jsPDF); if(!JS) throw new Error('PDF-Bibliothek noch nicht geladen – kurz warten und erneut versuchen.');
  const doc=new JS(); let y=20;
  const prof=(belegProfiles()[d.profileIdx||0])||{};
  if(prof.logo){ try{ doc.addImage(prof.logo, prof.logo.indexOf('image/png')>=0?'PNG':'JPEG', 150, 12, 45, 18); }catch(e){} }
  if(prof.name){ doc.setFontSize(12); doc.text(String(prof.name),20,y); y+=6; }
  if(prof.adresse){ doc.setFontSize(9); String(prof.adresse).split('\n').forEach(l=>{ doc.text(l,20,y); y+=4; }); }
  if(prof.ustid){ doc.setFontSize(9); doc.text('USt-IdNr.: '+prof.ustid,20,y); y+=4; }
  y+=8;
  doc.setFontSize(20); doc.text(String(d.typ),20,y); y+=8;
  doc.setFontSize(10); doc.text('Nr. '+d.nr+'  ·  '+fmtDate(d.date),20,y); y+=10;
  doc.setFontSize(12); doc.text('Kunde: '+String(d.kunde||'')+(d.land?'  ('+d.land+')':''),20,y); y+=7;
  doc.setFontSize(10); if(d.ustid){ doc.text('USt-IdNr.: '+d.ustid,20,y); y+=6; } y+=5;
  doc.text('Beschreibung',20,y); doc.text('Menge',120,y); doc.text('Einzel',145,y); doc.text('Summe',175,y); y+=2;
  doc.line(20,y,195,y); y+=6;
  (d.items||[]).forEach(it=>{ doc.text(String(it.bez||'').slice(0,55),20,y); doc.text(String(it.menge),122,y,{align:'center'}); doc.text(eur(it.preis),160,y,{align:'right'}); doc.text(eur(it.menge*it.preis),193,y,{align:'right'}); y+=6; if(y>270){doc.addPage();y=20;} });
  y+=4; doc.line(120,y,195,y); y+=7;
  doc.text('Netto: '+eur(d.netto),193,y,{align:'right'}); y+=6;
  doc.text('zzgl. '+(d.mwstSatz!=null?d.mwstSatz:19)+'% MwSt: '+eur(d.mwst),193,y,{align:'right'}); y+=7;
  doc.setFontSize(13); doc.text('Gesamt: '+eur(d.brutto),193,y,{align:'right'}); doc.setFontSize(10);
  if(d.hinweis){ y+=14; doc.text(doc.splitTextToSize(String(d.hinweis),175),20,y); }
  if(prof.footer){ doc.setFontSize(9); doc.text(doc.splitTextToSize(String(prof.footer),175),20,285); }
  return doc.output('datauristring').split(',')[1];
}

function bankImportCSV(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    const text=String(r.result);
    const lines=text.split(/\r?\n/).filter(l=>l.trim());
    if(!lines.length){ toast('CSV leer.',true); return; }
    const delim=(lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length?';':',';
    const split=l=>{ const out=[]; let cur='',q=false; for(const ch of l){ if(ch==='"'){q=!q;} else if(ch===delim&&!q){out.push(cur);cur='';} else cur+=ch; } out.push(cur); return out.map(s=>s.trim().replace(/^"|"$/g,'')); };
    const header=split(lines[0]).map(h=>h.toLowerCase());
    const find=(...keys)=>header.findIndex(h=>keys.some(k=>h.includes(k)));
    const iDat=find('datum','buchungstag','valuta','date');
    const iBet=find('betrag','umsatz','amount','soll','haben');
    const iZwe=find('verwendungszweck','buchungstext','zweck','vorgang','beschreibung','description','name');
    const parseAmt=s=>{ if(s==null)return null; s=String(s).replace(/[^\d,.\-]/g,''); if(!s)return null; if(s.indexOf(',')>-1&&s.indexOf('.')>-1){ s=s.replace(/\./g,'').replace(',', '.'); } else if(s.indexOf(',')>-1){ s=s.replace(',', '.'); } const n=parseFloat(s); return isNaN(n)?null:n; };
    const rows=lines.slice(1).map(l=>split(l));
    const tx=bankTx(); let added=0;
    rows.forEach(cols=>{
      const datum = iDat>=0?cols[iDat]:(cols[0]||'');
      let betrag = iBet>=0?parseAmt(cols[iBet]):null;
      if(betrag==null){ for(const c of cols){ if(/[.,]\d{2}\s*$/.test(String(c))){ const n=parseAmt(c); if(n!=null){ betrag=n; break; } } } }
      const zweck = iZwe>=0?cols[iZwe]:cols.filter((_,k)=>k!==iDat&&k!==iBet).join(' ');
      if(datum||betrag!=null||zweck){ tx.push({id:uid(),datum,betrag,zweck,matchBelegId:''}); added++; }
    });
    DB.write('bank_tx',tx); render(); toast(added+' Buchungen importiert.');
  };
  r.readAsText(f,'utf-8');
}
function bankAddBeleg(input){
  const files=input.files; if(!files||!files.length) return;
  const bel=bankBelege(); const newIds=[]; let done=0; const total=files.length;
  Array.from(files).forEach(f=>{ const r=new FileReader(); r.onload=async()=>{ const id=uid(); bel.push({id,name:f.name,betrag:null,fileData:String(r.result),date:Date.now()}); newIds.push(id); done++; if(done===total){ DB.write('bank_belege',bel); render(); toast(total+' Beleg(e) hochgeladen – KI liest…'); for(const nid of newIds){ await bankReadReceipt(nid); } render(); toast('KI-Erkennung fertig – bitte Beträge kurz prüfen.'); } }; r.readAsDataURL(f); });
}
async function bankReadReceipt(id){
  const b=bankBelege().find(x=>x.id===id); if(!b||!b.fileData) return;
  try{
    const r=await fetch(`${API_BASE}/read-receipt`,{method:'POST',headers:{'Content-Type':'application/json','x-api-key':API_KEY},body:JSON.stringify({dataUrl:b.fileData})});
    const j=await r.json();
    if(j&&j.data){
      const bel=bankBelege(); const b2=bel.find(x=>x.id===id);
      if(b2){
        if((b2.betrag==null||b2.betrag==='') && j.data.betrag!=null) b2.betrag=Math.round((+j.data.betrag)*100)/100;
        if(j.data.datum) b2.datum=j.data.datum;
        if(j.data.haendler) b2.haendler=j.data.haendler;
        if(j.data.kategorie) b2.kategorie=j.data.kategorie;
        if(j.data.mwst!=null) b2.mwst=j.data.mwst;
        DB.write('bank_belege',bel);
        // Auto-Zuordnung: passende offene Bank-Buchung nach Betrag (und Datum) direkt zuordnen
        if(b2.betrag!=null){
          const txs=bankTx();
          let cands=txs.filter(t=>!t.matchBelegId && Math.abs(Math.abs(+t.betrag||0)-Math.abs(b2.betrag))<0.01);
          if(cands.length>1 && b2.datum){ cands=cands.slice().sort((a,c)=>Math.abs(new Date(a.datum||0)-new Date(b2.datum))-Math.abs(new Date(c.datum||0)-new Date(b2.datum))); }
          if(cands.length){ const t=txs.find(x=>x.id===cands[0].id); if(t){ t.matchBelegId=b2.id; DB.write('bank_tx',txs); } }
        }
      }
    }
  }catch(e){}
}
function bankBelegBetrag(id,v){ const bel=bankBelege(); const b=bel.find(x=>x.id===id); if(b){ b.betrag=parseFloat(v)||null; DB.write('bank_belege',bel); } }
function bankMatch(txId,belId){ const tx=bankTx(); const t=tx.find(x=>x.id===txId); if(t){ t.matchBelegId=belId; DB.write('bank_tx',tx); render(); } }
function bankDelTx(id){ if(roGuard())return; DB.write('bank_tx',bankTx().filter(x=>x.id!==id)); render(); }
function bankDelBeleg(id){ if(roGuard())return; DB.write('bank_belege',bankBelege().filter(x=>x.id!==id)); render(); }
function bankViewBeleg(id){ const b=bankBelege().find(x=>x.id===id); if(b&&b.fileData){ const w=window.open(); if(w){ w.document.write('<iframe src="'+b.fileData+'" style="border:0;width:100%;height:100vh"></iframe>'); } } }
function bankExport(){
  const tx=bankTx(); const bel=bankBelege();
  if(!tx.length){ toast('Keine Buchungen.',true); return; }
  const rows=[['Datum','Betrag','Verwendungszweck','Zugeordneter Beleg','Beleg-Betrag']];
  tx.forEach(t=>{ const b=bel.find(x=>x.id===t.matchBelegId); rows.push([t.datum||'',t.betrag!=null?t.betrag:'',t.zweck||'',b?b.name:'',b&&b.betrag!=null?b.betrag:'']); });
  const csv=rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  downloadTextFile('bank_abgleich_'+new Date().toISOString().slice(0,10)+'.csv', csv, 'text/csv');
  toast('Export erstellt.');
}
async function bankAISuggest(){
  const tx=bankTx().filter(t=>!t.matchBelegId); const bel=bankBelege();
  if(!tx.length){ toast('Alle Buchungen sind bereits zugeordnet.'); return; }
  if(!bel.length){ toast('Keine Belege zum Zuordnen.',true); return; }
  const txList=tx.map(t=>`TX ${t.id}: ${t.datum||''} | ${t.betrag!=null?t.betrag+' EUR':''} | ${(t.zweck||'').slice(0,80)}`).join('\n');
  const belList=bel.map(b=>`BELEG ${b.id}: ${b.name}${b.betrag!=null?' | '+b.betrag+' EUR':''}`).join('\n');
  const prompt=`Ordne Bank-Buchungen den passenden Belegen zu (nach Betrag, Datum, Text). Gib NUR ein JSON-Array zurück im Format [{"tx":"<TX-ID>","beleg":"<BELEG-ID>"}]. Nur eindeutige, sichere Zuordnungen.\n\nBuchungen:\n${txList}\n\nBelege:\n${belList}`;
  await aiRun('bankAiBtn', prompt, 'Du bist Buchhaltungs-Assistent. Antworte ausschließlich mit gültigem JSON, ohne Erklärung.', (t)=>{
    let pairs=[]; try{ const m=t.match(/\[[\s\S]*\]/); pairs=JSON.parse(m?m[0]:t); }catch(e){ toast('KI-Antwort nicht lesbar.',true); return; }
    const txs=bankTx(); let n=0;
    (pairs||[]).forEach(p=>{ const t2=txs.find(x=>x.id===p.tx); if(t2 && bel.find(b=>b.id===p.beleg)){ t2.matchBelegId=p.beleg; n++; } });
    DB.write('bank_tx',txs); render(); toast(n+' Zuordnung(en) durch KI.');
  });
}

   <div class="cards grid-2">
     <div class="card"><h3 style="margin-top:0">Voll-Backup</h3><p class="muted" style="font-size:12px">Sichert ALLE Daten in eine Datei.</p>
       <button class="btn" onclick="exportBackup()">⬇ Backup herunterladen</button>
       <div class="field" style="margin-top:14px"><label>Backup wiederherstellen</label><input type="file" id="restoreFile" accept="application/json"></div>
       <button class="btn warn" onclick="importBackup()">Wiederherstellen (überschreibt alles!)</button>
     </div>
     <div class="card"><h3 style="margin-top:0">Einzel-Export (CSV)</h3>
       <div class="flexbtns"><button class="btn gray" onclick="exportCSV('contacts')">Kontakte</button><button class="btn gray" onclick="exportCSV('deals')">Deals</button><button class="btn gray" onclick="exportCSV('mpu_clients')">MPU-Kunden</button></div>
       <p class="muted" style="font-size:12px;margin-top:10px">CSV öffnet sich z.B. in Excel.</p>
     </div>
   </div>`;
}
function downloadFile(name,content,type){ const b=new Blob([content],{type}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click(); }
function exportBackup(){ const all={}; for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if(k&&k.indexOf('cmsdlx_')===0) all[k]=localStorage.getItem(k);} downloadFile('cms-backup-'+todayISO()+'.json',JSON.stringify(all,null,2),'application/json'); }
function importBackup(){ const f=document.getElementById('restoreFile'); if(!f.files[0]){alert('Bitte Datei wählen.');return;} if(!confirm('Wirklich ALLE aktuellen Daten überschreiben?'))return; const r=new FileReader(); r.onload=()=>{ try{ const all=JSON.parse(r.result); Object.keys(all).forEach(k=>localStorage.setItem(k,all[k])); alert('Wiederhergestellt. Seite wird neu geladen.'); location.reload(); }catch(e){ alert('Ungültige Backup-Datei.'); } }; r.readAsText(f.files[0]); }
function exportCSV(key){ const rows=DB.read(key,[]); if(!rows.length){alert('Keine Daten.');return;} const heads=Object.keys(rows[0]).filter(k=>typeof rows[0][k]!=='object'); const csv=[heads.join(';'),...rows.map(r=>heads.map(h=>'"'+String(r[h]==null?'':r[h]).replace(/"/g,'""')+'"').join(';'))].join('\n'); downloadFile(key+'.csv',csv,'text/csv'); }

/* ============================================================
   TEXTBAUSTEINE / VORLAGEN
   ============================================================ */
function vorlagenView(){
  const t=DB.read('templates',[]);
  return head('Textbausteine','Fertige Texte für E-Mail & WhatsApp – schneller antworten',`<button class="btn" onclick="editTemplate()">+ Vorlage</button>`)+`
   <div class="cards grid-2">${t.length?t.map(x=>`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>${esc(x.name)}</b><button class="btn ghost sm" onclick="delTemplate('${x.id}')">✕</button></div><p style="font-size:13px;white-space:pre-wrap;margin:8px 0 0">${esc(x.text)}</p></div>`).join(''):'<p class="muted">Noch keine Vorlagen.</p>'}</div>`;
}
function editTemplate(){
  openModal(`<div class="modal-head"><h2>Neue Vorlage</h2><button class="x" onclick="closeModal()">×</button></div>
    <div class="field"><label>Name</label><input id="tpl_name" placeholder="z.B. Angebot Nachfassen"></div>
    <div class="field"><label>Text</label><textarea id="tpl_text" style="min-height:120px"></textarea></div>
    <button class="btn" onclick="saveTemplate()">Speichern</button>`);
}
function saveTemplate(){ const name=document.getElementById('tpl_name').value.trim(); const text=document.getElementById('tpl_text').value.trim(); if(!name||!text){alert('Name und Text nötig.');return;} const t=DB.read('templates',[]); t.push({id:uid(),name,text}); DB.write('templates',t); closeModal(); render(); }
function delTemplate(id){ DB.write('templates',DB.read('templates',[]).filter(x=>x.id!==id)); render(); }
function templateSelectHtml(target){ const t=DB.read('templates',[]); if(!t.length)return ''; return `<div class="field"><label>Textbaustein einfügen</label><select onchange="insertTemplate(this.value,'${target}');this.value='';"><option value="">– wählen –</option>${t.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div>`; }
function insertTemplate(id,target){ if(!id)return; const t=DB.read('templates',[]).find(x=>x.id===id); const el=document.getElementById(target); if(t&&el) el.value=(el.value?el.value+'\n\n':'')+t.text; }

/* ============================================================
   LOGIN
   ============================================================ */
let CURRENT_USER = null;
let PICKED_ROLE = 'Chef';
function defaultPw(role){ return role==='Chef'?'chef':'mpu'; }
function getPw(role){ return DB.read('pw_'+role, defaultPw(role)); }
function pickRole(role){
  PICKED_ROLE=role;
  document.getElementById('role-chef').classList.toggle('sel',role==='Chef');
  document.getElementById('role-ma').classList.toggle('sel',role==='Mitarbeiter');
}
function doLogin(){
  const pw=document.getElementById('loginPw').value;
  if(pw!==getPw(PICKED_ROLE)){ alert('Falsches Passwort.'); return; }
  CURRENT_USER=PICKED_ROLE; DB.write('current_user',CURRENT_USER);
  document.getElementById('loginPw').value='';
  boot();
}
function logout(){
  // Mitarbeiter muss erst den heutigen Tagesbericht abgeben
  if(CURRENT_USER==='Mitarbeiter' && !maHasReportToday()){
    alert('Bitte zuerst den heutigen Tagesbericht ausfüllen, bevor du die Plattform schließt.');
    go('tagesbericht'); return;
  }
  CURRENT_USER=null; DB.write('current_user',null); hideCenterWarning();
  document.getElementById('loginScreen').style.display='flex';
}
function boot(){
  document.getElementById('loginScreen').style.display='none';
  // Chef startet im Maschinenbau, Mitarbeiter in der MPU-Maske – beide können oben umschalten
  setCompany(CURRENT_USER==='Mitarbeiter'?'mpu':'mb');
  if(isChef()) go('cockpit');
  checkDailyWarning();
}
// Warnung beim Schließen, falls Mitarbeiter den Tagesbericht noch nicht abgegeben hat
window.addEventListener('beforeunload',function(e){
  if(CURRENT_USER==='Mitarbeiter' && !maHasReportToday()){ e.preventDefault(); e.returnValue=''; return ''; }
});
function changePassword(){
  const cur=prompt('Aktuelles Passwort für '+CURRENT_USER+':'); if(cur===null)return;
  if(cur!==getPw(CURRENT_USER)){ alert('Aktuelles Passwort falsch.'); return; }
  const neu=prompt('Neues Passwort:'); if(!neu)return;
  DB.write('pw_'+CURRENT_USER,neu); alert('Passwort geändert.');
}
