<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forbach Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
  --text:#e2e8f0; --muted:#94a3b8; --accent:#3b82f6; --accent2:#22c55e;
  --warn:#f59e0b; --danger:#ef4444; --mpu:#8b5cf6; --mb:#0ea5e9;
  --radius:12px; --shadow:0 4px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:14px}
a{color:var(--accent)}

/* TOPBAR */
.topbar{display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.logo{font-weight:800;font-size:18px;letter-spacing:.5px}
.logo span{color:var(--accent)}
.switcher{display:flex;background:var(--panel2);border-radius:999px;padding:4px;gap:4px}
.switcher button{border:0;background:transparent;color:var(--muted);padding:8px 16px;border-radius:999px;font-weight:600;font-size:13px}
.switcher button.active.mb{background:var(--mb);color:#fff}
.switcher button.active.mpu{background:var(--mpu);color:#fff}
.topbar .spacer{flex:1}
.userchip{display:flex;align-items:center;gap:8px;background:var(--panel2);padding:6px 12px;border-radius:999px;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent2)}

/* LAYOUT */
.layout{display:flex;min-height:calc(100vh - 57px)}
.sidebar{width:230px;background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;flex-shrink:0}
.navgroup{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:14px 8px 6px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--text);padding:10px 12px;border-radius:8px;text-align:left;font-size:14px;margin-bottom:2px}
.nav button:hover{background:var(--panel2)}
.nav button.active{background:var(--accent);color:#fff;font-weight:600}
.nav .ico{width:20px;text-align:center}
.main{flex:1;padding:22px 26px;overflow:auto}

/* COMPONENTS */
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}
.page-head h1{margin:0;font-size:22px}
.page-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.cards{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .val{font-size:30px;font-weight:800}
.kpi .lbl{color:var(--muted);font-size:13px}
.kpi .sub{font-size:12px;color:var(--accent2)}

.btn{border:0;border-radius:8px;padding:9px 16px;font-weight:600;font-size:13px;background:var(--accent);color:#fff}
.btn:hover{filter:brightness(1.1)}
.btn.green{background:var(--accent2)}
.btn.gray{background:var(--panel2);color:var(--text)}
.btn.warn{background:var(--warn);color:#111}
.btn.danger{background:var(--danger)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}

.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
.field input,.field textarea,.field select{width:100%;padding:9px 11px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text)}
.field textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row .field{flex:1;min-width:150px}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);font-size:13px}
tr:hover td{background:var(--panel2)}
.clickrow{cursor:pointer}

.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.b-neu{background:#1e3a5f;color:#7dd3fc}
.b-kontakt{background:#3b2f00;color:#fcd34d}
.b-interesse{background:#0c3b1e;color:#86efac}
.b-abschluss{background:#0c4a2e;color:#4ade80}
.b-kein{background:#3f1d1d;color:#fca5a5}
.b-offen{background:#3a2a00;color:#fcd34d}
.b-erledigt{background:#0c3b1e;color:#86efac}

.empty{text-align:center;color:var(--muted);padding:40px 20px}
.hidden{display:none!important}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:640px;padding:22px;box-shadow:var(--shadow)}
.modal.wide{max-width:880px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-head h2{margin:0;font-size:19px}
.x{border:0;background:transparent;color:var(--muted);font-size:22px;cursor:pointer}

.note-item{background:var(--panel2);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.note-item .meta{font-size:11px;color:var(--muted);margin-bottom:3px}
.tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);padding:3px 9px;border-radius:6px;font-size:12px;margin:2px}

.banner{background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--muted);margin-bottom:16px}
.banner b{color:var(--text)}

.tabbar{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabbar button{border:0;background:transparent;color:var(--muted);padding:9px 14px;font-weight:600;border-bottom:2px solid transparent}
.tabbar button.active{color:var(--text);border-bottom-color:var(--accent)}

.maillist{display:grid;grid-template-columns:280px 1fr;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:420px}
.maillist .list{border-right:1px solid var(--line);overflow:auto}
.mailrow{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.mailrow:hover,.mailrow.active{background:var(--panel2)}
.mailrow .from{font-weight:700;font-size:13px}
.mailrow .subj{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mailview{padding:18px}

.progress{height:10px;background:var(--panel2);border-radius:999px;overflow:hidden}
.progress > div{height:100%;background:var(--accent2)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;font-weight:700;padding:4px}
.cal .day{background:var(--panel2);border-radius:8px;min-height:84px;padding:6px;font-size:12px;border:1px solid transparent}
.cal .day.today{border-color:var(--accent)}
.cal .day .num{color:var(--muted);font-size:11px;margin-bottom:4px}
.cal .ev{background:var(--accent);color:#fff;border-radius:5px;padding:2px 5px;font-size:10px;margin-bottom:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev.mpu{background:var(--mpu)}
.cal .ev.priv{background:var(--warn);color:#111}

.flexbtns{display:flex;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted)}
.right{text-align:right}
.mb-acc{color:var(--mb)} .mpu-acc{color:var(--mpu)}
.list-plain{list-style:none;padding:0;margin:0}
.list-plain li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px}
.nodl{user-select:none}
.fileicon{width:34px;height:34px;border-radius:7px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:16px}
.navbadge{margin-left:auto;background:var(--danger);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px}
/* LOGIN */
.login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#0f172a,#1e293b);display:flex;align-items:center;justify-content:center;z-index:200}
.login-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:34px;width:100%;max-width:380px;box-shadow:var(--shadow);text-align:center}
.login-box .logo{font-size:26px;margin-bottom:6px}
.login-box p{color:var(--muted);font-size:13px;margin:0 0 20px}
.role-pick{display:flex;gap:10px;margin-bottom:16px}
.role-pick button{flex:1;background:var(--panel2);border:2px solid var(--line);color:var(--text);border-radius:12px;padding:14px 8px;font-weight:700;font-size:14px}
.role-pick button.sel{border-color:var(--accent);background:rgba(59,130,246,.15)}
.role-pick .emoji{font-size:26px;display:block;margin-bottom:4px}
.login-box input{width:100%;padding:11px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);margin-bottom:12px;text-align:center}
.login-hint{font-size:11px;color:var(--muted);margin-top:14px}
.logoutbtn{border:0;background:var(--panel2);color:var(--muted);padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600}
.logoutbtn:hover{color:var(--text)}
.banner.alert{border-color:var(--warn);background:rgba(245,158,11,.12);color:#fcd34d}
.searchbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.searchbar input,.searchbar select{padding:9px 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text)}
.searchbar input{flex:1;min-width:180px}
.center-warn{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:150}
.center-warn-box{background:var(--panel);border:2px solid var(--warn);border-radius:16px;padding:30px;max-width:440px;text-align:center;box-shadow:var(--shadow)}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:225px;width:225px;flex-shrink:0;display:flex;flex-direction:column;max-height:74vh}
.col.dragover{outline:2px dashed var(--accent);outline-offset:-2px}
.col-head{padding:11px 12px;border-bottom:1px solid var(--line)}
.col-head .t{font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.col-head .s{font-size:11px;color:var(--muted);margin-top:2px}
.col-body{padding:9px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:8px;min-height:50px}
.deal{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:grab}
.deal:hover{border-color:var(--accent)}
.deal.dragging{opacity:.35}
.deal .f{font-weight:700;font-size:13px}
.deal .a{font-size:11px;color:var(--muted)}
.deal .v{font-weight:700;color:var(--accent2);font-size:13px;margin-top:5px}
.deal .due{display:inline-block;font-size:10px;color:#111;background:#fcd34d;border-radius:4px;padding:1px 5px;margin-top:5px}
.stagedot{width:9px;height:9px;border-radius:50%;display:inline-block}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}50%{box-shadow:0 0 0 4px rgba(239,68,68,0)}}
.blink{animation:blink 1s infinite}
.lead-new{border-color:var(--danger)!important;animation:glow 1.4s infinite}
.lead-new .f::before{content:'🔴 '}
.navbadge.blink{background:var(--danger)}
.alertcard{display:flex;align-items:center;gap:12px;background:rgba(239,68,68,.12);border:1px solid var(--danger);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.alertcard .big{font-size:22px}
.score-pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px;padding:3px 9px;border-radius:999px}
.sc-green{background:#0c3b1e;color:#86efac}.sc-amber{background:#3a2a00;color:#fcd34d}.sc-red{background:#3f1d1d;color:#fca5a5}
.taskrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.taskrow.done{opacity:.5}
.taskrow.done .tt{text-decoration:line-through}
.taskrow .tt{flex:1}
.prio{font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px}
.prio.hoch{background:#3f1d1d;color:#fca5a5}.prio.mittel{background:#3a2a00;color:#fcd34d}.prio.niedrig{background:#273449;color:#94a3b8}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--panel2);padding:8px 10px;border-radius:6px;word-break:break-all}
.globalsearch{position:relative;width:230px}
.globalsearch input{width:100%;padding:8px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;color:var(--text);font-size:13px}
.search-results{display:none;position:absolute;top:42px;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:320px;overflow:auto;z-index:80}
.search-results .sr{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.search-results .sr:hover{background:var(--panel2)}
.search-results .sr .ty{font-size:10px;color:var(--muted)}
.bell{position:relative;cursor:pointer;font-size:18px;padding:4px 6px}
.bell-count{position:absolute;top:-2px;right:-4px;background:var(--danger);color:#fff;border-radius:999px;font-size:10px;font-weight:800;padding:0 5px;display:none}
.bell-panel{display:none;position:absolute;top:34px;right:0;width:300px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:80;padding:8px;text-align:left}
.bell-panel .bi{padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12px}
.bell-panel .bi:hover{background:var(--panel2)}
.tl{position:relative;padding-left:18px}
.tl::before{content:'';position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .ev{position:relative;margin-bottom:12px}
.tl .ev::before{content:'';position:absolute;left:-16px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.tl .ev .meta{font-size:11px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:10px;height:160px;padding-top:10px}
.bars .bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .bar .b{width:100%;background:var(--accent);border-radius:6px 6px 0 0;min-height:2px}
.bars .bar .bl{font-size:10px;color:var(--muted);text-align:center}
.bars .bar .bv{font-size:11px;font-weight:700}
@media print{.topbar,.sidebar,.bell,.globalsearch,.logoutbtn,.switcher{display:none!important}.main{padding:0}#printArea{display:block!important}}

/* ============================================================
   THEME: LINEAR / STRIPE  – hell, flach, reduziert (Forbach Group)
   Kein Verlauf, kein Glow, kein Glas. Klare Flächen & Haarlinien.
   ============================================================ */
:root{
  --bg:#f6f7f9; --bg-2:#eef0f3; --panel:#ffffff; --panel2:#f4f5f7;
  --line:#e8e9ee; --line-strong:#d9dbe1;
  --text:#1c1e26; --muted:#697586;
  --accent:#2f6bed; --accent-deep:#2456c9; --accent2:#0f9d76;
  --warn:#b45309; --danger:#d64550; --mpu:#7c5cd6; --mb:#2f6bed;
  --radius:10px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --ring:0 0 0 3px rgba(47,107,237,.18);
  --card:#ffffff; --border:#e8e9ee;
  /* dunkle Seitenleiste */
  --side:#141822; --side-2:#1c2130; --side-line:#262c3b; --side-ink:#aeb6c6; --side-ink2:#9aa3ba;
}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);letter-spacing:0}
h1,h2,h3{letter-spacing:-.02em}
a{color:var(--accent)}
::selection{background:rgba(91,95,199,.18)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:#d3d6de;border-radius:8px;border:3px solid var(--bg);background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#bcc0cb;background-clip:padding-box}

/* Topbar – flach, weiß */
.topbar{gap:18px;padding:0 20px;height:56px;background:var(--panel);backdrop-filter:none;-webkit-backdrop-filter:none;border-bottom:1px solid var(--line)}
.logo{font-weight:700;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:9px;color:var(--text)}
.logo::before{content:"";width:20px;height:20px;border-radius:6px;background:var(--accent)}
.logo span{color:var(--accent)}
.switcher{background:var(--panel2);border:1px solid var(--line);padding:3px;border-radius:9px}
.switcher button{border-radius:6px;font-size:13px;color:var(--muted);transition:.12s;letter-spacing:-.01em}
.switcher button:hover{color:var(--text)}
.switcher button.active.mb,.switcher button.active.mpu{background:var(--panel);color:var(--text);box-shadow:var(--shadow-sm);font-weight:600}
.switcher button.active.mb{box-shadow:var(--shadow-sm),inset 0 0 0 1px var(--line)}
.userchip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--text)}
.dot{box-shadow:none}
.logoutbtn{background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.logoutbtn:hover{color:var(--text);background:var(--panel2)}

/* Sidebar / Nav */
.layout{min-height:calc(100vh - 56px)}
.sidebar{width:250px;background:var(--side);border-right:1px solid var(--side-line);padding:12px 10px}
.navgroup{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--side-ink2);margin:16px 10px 6px;font-weight:600}

/* Item-Buttons (Leaf-Links) */
.nav .navitem{display:flex;align-items:center;gap:10px;border-radius:9px;padding:8px 10px;font-size:13.5px;font-weight:500;color:var(--side-ink);position:relative;transition:background .13s,color .13s;letter-spacing:-.01em;width:100%;background:none;border:0;cursor:pointer;text-align:left}
.nav .navitem:hover{background:var(--side-2);color:#fff}
.nav .navitem.active{background:linear-gradient(135deg,rgba(47,107,237,.32),rgba(47,107,237,.13));color:#fff;font-weight:600;box-shadow:inset 0 0 0 1px rgba(47,107,237,.45)}
.nav .navitem.active::before{content:"";position:absolute;left:-1px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent)}
.nav .navitem .ico{width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 auto}
.nav .navitem.active .ico{background:rgba(255,255,255,.14)}
.navbadge{background:var(--danger)}

/* Gruppen-Kopf (Akkordeon-Trigger) – bewusst ANDERS als ein Link: kein Hover-Block, klarer Trenn-Look */
.navgrouphead{display:flex;align-items:center;gap:7px;width:100%;background:none;border:0;cursor:pointer;font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:#d3d8e6!important;opacity:1!important;font-weight:700;padding:8px 6px;margin:2px 0 0;border-radius:6px;transition:color .12s;-webkit-tap-highlight-color:transparent}
.navgrouphead .label{color:#d3d8e6!important}
.navgrouphead:hover{color:var(--side-ink,#e9ecf3);background:rgba(255,255,255,.035)}
.navgrouphead:focus{outline:none}
.navgrouphead:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.navgrouphead.open{color:var(--side-ink,#e9ecf3)}
.navgrouphead .navchev{flex:0 0 auto;width:14px;height:14px;display:flex;align-items:center;justify-content:center;transition:transform .22s cubic-bezier(.4,0,.2,1)}
.navgrouphead .navchev svg{width:9px;height:9px;transition:transform .22s cubic-bezier(.4,0,.2,1)}
.navgrouphead.open .navchev svg{transform:rotate(90deg)}
.navgrouphead .label{flex:1;text-align:left}

<script>
/* ============================================================
   DATENSCHICHT  (localStorage)
   ============================================================ */
const DB = {
  read(k, def){ try{ return JSON.parse(localStorage.getItem('cmsdlx_'+k)) ?? def }catch(e){ return def } },
  write(k, v){ localStorage.setItem('cmsdlx_'+k, JSON.stringify(v)) },
};

/* ============================================================
   API-ANBINDUNG – CMS nutzt echte Datenbank (Supabase) statt localStorage.
   So teilen sich Chef + Mitarbeiter dieselben Daten von überall.
   ============================================================ */
const API_BASE = 'https://cms-deluxe-api.vercel.app/api';
const API_KEY  = 'cmsk_dc4bb60ff48e7e15601e9578c80f7e55f89a723a';
const API_KEYS = [
  'contacts','deals','mb_leads','mb_kaltliste','mpu_leads','mpu_clients','activities','documents',
  'mb_mails','mpu_mails','mpu_whatsapp','mb_calls','mb_linkedin','mb_marketing',
  'mb_automations','stage_autos','stage_autos_mpu_beratung','stage_autos_mpu_plattform',
  'mb_events','mpu_events','mpu_videolink','messages','permissions','pw_Chef','pw_Mitarbeiter',
  'tasks_project','tasks_personal','mb_pdf_library','mpu_pdf_library','templates','finanzen','provision_rate',
  'availability','daily_reports','mb_exchange','make_webhooks','competitors','theme','seeded',
  'googleAdsStats','linkedinAdsStats','websiteStats'
];
const _cache = {};
async function apiGet(key){
  const r = await fetch(`${API_BASE}/data?key=${encodeURIComponent(key)}`, { headers: { 'x-api-key': API_KEY } });
  const j = await r.json();
  return j.value;
}
async function apiPut(key, value){
  await fetch(`${API_BASE}/data?key=${encodeURIComponent(key)}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
    body: JSON.stringify({ value })
  });
}
DB.read = (k, def) => { const v = _cache[k]; return (v === undefined || v === null) ? def : v; };
DB.write = (k, v) => { _cache[k] = v; apiPut(k, v); };
async function loadCache(){
  for (const k of API_KEYS){ try { _cache[k] = await apiGet(k); } catch(e){ _cache[k] = null; } }
}
setInterval(async () => {
  try { _cache['mb_leads'] = await apiGet('mb_leads'); _cache['mpu_leads'] = await apiGet('mpu_leads'); _cache['mpu_whatsapp'] = await apiGet('mpu_whatsapp'); if (typeof renderNav === 'function') renderNav(); } catch(e){}
}, 30000);

// Aktualisiert die make.com-gespeisten Kennzahlen (Ads/Website/Wettbewerb) im Hintergrund
// und rendert neu, falls gerade die betroffene Ansicht offen ist. Wird beim Öffnen von
// "Ads & Wettbewerb" / "Website-Monitor" angestoßen (siehe MB._after_ads/_after_website).
async function refreshMakeStats(){
  for (const k of ['googleAdsStats','linkedinAdsStats','websiteStats','competitors']){
    try { _cache[k] = await apiGet(k); } catch(e){}
  }
  if (VIEW==='ads' || VIEW==='website') render();
}

/* ============================================================
   KI-HELFER (Claude) – ruft api/ai-assistant.
   Prinzip "einmal analysieren, speichern": Ergebnis wird beim Kunden
   gespeichert und nur neu berechnet, wenn sich die Daten geändert haben
   oder man bewusst auf "Neu analysieren" klickt (spart Kosten).
   ============================================================ */
async function aiCall(prompt, system){
  const r = await fetch(`${API_BASE}/ai-assistant`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'x-api-key':API_KEY },
    body: JSON.stringify({ prompt, system })
  });
  const j = await r.json();
  if(!r.ok || j.error) throw new Error(j.error || 'KI nicht erreichbar');
  return j.text;
}
function aiResultModal(title, text, opts){
  opts = opts || {};
  const safe = esc(text).replace(/\n/g,'<br>');
  openModal(`<div class="modal-head"><h2>✨ ${esc(title)}</h2><button class="x" onclick="closeModal()">×</button></div>
    ${opts.date?`<p class="muted" style="font-size:11px;margin:0 0 8px">Zuletzt analysiert: ${esc(opts.date)}</p>`:''}
    <div style="line-height:1.6">${safe}</div>
    <div class="flexbtns" style="margin-top:14px">
      <button class="btn sm" data-t="${esc(text)}" onclick="navigator.clipboard.writeText(this.dataset.t);this.textContent='Kopiert ✓'">In Zwischenablage kopieren</button>
      ${opts.onRefresh?`<button class="btn gray sm" onclick="${opts.onRefresh}">🔄 Neu analysieren</button>`:''}
    </div>`, true);
}
async function aiRun(btnId, prompt, system, onText){
  const btn = btnId ? document.getElementById(btnId) : null;
  const old = btn ? btn.textContent : null;
  if(btn){ btn.disabled=true; btn.textContent='✨ denkt nach…'; }
  try { const t = await aiCall(prompt, system); onText(t); }
  catch(e){ alert('KI-Fehler: '+e.message); }
  finally { if(btn){ btn.disabled=false; btn.textContent=old; } }
}
// Zustand der Kundendaten als kurzer "Fingerabdruck" – ändert er sich, wird neu analysiert.
function kiClientStamp(c){
  return [c.anlass,c.abstinenzMonate,c.abstinenzStart,c.stundenGesamt,c.stundenGemacht,(c.sessions||[]).length,(c.akten||[]).map(a=>a.name).join('|'),(c.zertifikate||[]).length].join('~');
}
async function kiAkteZusammenfassen(id, force){
  const cl=DB.read('mpu_clients',[]); const c=cl.find(x=>x.id===id); if(!c) return;
  const stamp=kiClientStamp(c);
  if(!force && c.aiSummary && c.aiSummaryStamp===stamp){
    aiResultModal('MPU-Akte: '+c.name, c.aiSummary, {date:c.aiSummaryDate, onRefresh:`kiAkteZusammenfassen('${id}',true)`});
    return;

/* E-Mail-Empfang: Posteingang per IMAP abrufen und in mb_mails übernehmen (dir:'in'). */
async function mbFetchInbox(){
  const btn=document.getElementById('mbInboxBtn'); const old=btn?btn.textContent:'';
  if(btn){ btn.disabled=true; btn.textContent='📥 lädt…'; }
  try {
    const r=await fetch(`${API_BASE}/fetch-mail`, { headers:{ 'x-api-key':API_KEY } });
    const j=await r.json();
    if(!r.ok || j.error) throw new Error(j.error || 'Abruf fehlgeschlagen');
    const mails=DB.read('mb_mails',[]);
    const seen=new Set(mails.filter(m=>m.dir==='in').map(m=>m.date+'|'+m.subj));
    let added=0;
    (j.mails||[]).forEach(m=>{
      const key=m.date+'|'+m.subj;
      if(!seen.has(key)){ mails.unshift({id:uid(),from:m.from||m.email,email:m.email,subj:m.subj,body:m.body,date:m.date,read:false,dir:'in'}); seen.add(key); added++; }
    });
    mails.sort((a,b)=>b.date-a.date);
    DB.write('mb_mails',mails);
    render();
    toast(added>0 ? added+' neue Mail(s) im Posteingang.' : 'Keine neuen Mails.');
  } catch(e){ toast('Posteingang-Fehler: '+e.message, true); }
  finally { if(btn){ btn.disabled=false; btn.textContent=old; } }
}

/* Sanfte, nicht-blockierende Meldung (Toast) statt alert(). */
function toast(msg, isError){
  let t=document.getElementById('cmsToast');
  if(!t){ t=document.createElement('div'); t.id='cmsToast';
    t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:99999;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.35);transition:opacity .3s;opacity:0';
    document.body.appendChild(t);
  }
  t.style.background=isError?'#b91c1c':'#16a34a'; t.style.color='#fff';
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(t._h); t._h=setTimeout(()=>{ t.style.opacity='0'; }, 3200);
}

/* MPU-Kunden-Score automatisch aus Fortschritt */
function clientScore(c){
  let s=0;
  const stundenPct = c.stundenGesamt? c.stundenGemacht/c.stundenGesamt:0; s+=stundenPct*40;            // bis 40
  // Abstinenz-Fortschritt (Kunden ohne Abstinenzpflicht bekommen hier volle Punktzahl statt Abzug)
  if(c.abstinenzNoetig===false || !c.abstinenzMonate){ s+=30; }
  else { try{ const end=new Date(c.abstinenzStart); end.setMonth(end.getMonth()+c.abstinenzMonate); const total=c.abstinenzMonate*30; const left=Math.ceil((end-new Date())/86400000); const done=Math.min(1,Math.max(0,(total-left)/total)); if(!isNaN(done)) s+=done*30; else s+=30; }catch(e){ s+=30; } }
  s += Math.min(1,(c.zertifikate?.length||0)/1)*15;     // Nachweise bis 15
  s += Math.min(1,(c.sessions?.length||0)/3)*15;        // Aktivität bis 15
  s=Math.round(Math.min(100,s));
  if(isNaN(s)) s=0;
  const ampel = s>=66?'green':s>=33?'amber':'red';
  return {score:s,ampel};
}
function scorePill(c){ const {score,ampel}=clientScore(c); const lbl=ampel==='green'?'Top':ampel==='amber'?'Mittel':'Achtung'; return `<span class="score-pill sc-${ampel}">${ampel==='green'?'🟢':ampel==='amber'?'🟡':'🔴'} ${score} · ${lbl}</span>`; }

            <p class="muted" style="font-size:12px;margin:4px 0">${esc(x.adresse||'')} · ⭐ ${esc(String(x.rating||'–'))} (${esc(String(x.bewertungen||'0'))} Bew.) · ${esc(x.quelle||'')}</p>
            <p style="margin:4px 0;font-size:13px">${x.tel?`📞 <a href="tel:${esc(x.tel)}">${esc(x.tel)}</a>`:`<span class="muted">📞 keine Nummer</span>`}${x.website?` · 🌐 <a href="${esc(x.website)}" target="_blank">Website / Impressum</a>`:``}</p>
            ${x.wv?`<p style="margin:4px 0;font-size:12px${overdue?';color:#fcd34d':''}">🔔 Wiedervorlage: ${esc(x.wv)}${overdue?' (überfällig)':''}</p>`:``}
            ${x.notiz?`<p style="margin:6px 0;font-size:13px">📝 ${esc(x.notiz)}</p>`:''}
          </div>
          <div class="flexbtns">

            <select onchange="MB.klSet('${x.id}','status',this.value)" class="btn sm gray">${[['neu','Neu'],['nicht_erreicht','Nicht erreicht'],['angerufen','Erreicht'],['termin','Termin'],['sperrliste','Sperrliste']].map(p=>`<option value="${p[0]}" ${(x.status||'neu')===p[0]?'selected':''}>${p[1]}</option>`).join('')}</select>
            <input type="date" value="${esc(x.wv||'')}" onchange="MB.klWv('${x.id}',this.value)" class="btn sm gray" title="Wiedervorlage-Datum">
            <button class="btn sm gray" onclick="MB.klNote('${x.id}')">📝 Notiz</button>
            ${x.place_id?`<a class="btn sm gray" target="_blank" href="https://www.google.com/maps/place/?q=place_id:${encodeURIComponent(x.place_id)}">🗺️</a>`:''}

    return head('Kaltakquise-Liste','Nachfass-Pipeline – keine Firma geht verloren: jede wird bis zum Erreichen automatisch wiedervorgelegt',
      `<button class="btn gray" onclick="MB.klAutoKat()">🎯 Auto A/B/C</button> <button class="btn gray" onclick="MB.klDedupe()">🧹 Dubletten</button>`)+`
      <div class="card" style="margin-bottom:12px">
        <div class="flexbtns" style="flex-wrap:wrap;gap:6px">
          <span class="chip">📦 ${list.length} gesamt</span><span class="chip" style="border-color:#f97316;color:#fdba74">🔥 ${faellig} fällig heute</span><span class="chip">☎️ ${nieAngerufen} nie angerufen</span><span class="chip" style="border-color:#22c55e;color:#86efac">📞 ${erreicht} erreicht</span><span class="chip">📅 ${termine} Termine</span><span class="chip">🚫 ${sperr} Sperrliste</span><span class="chip">Σ ${versucheGes} Versuche</span>
        </div>
        <div class="flexbtns" style="flex-wrap:wrap;gap:6px;margin-top:10px">
          ${fbtn('faellig','🔥 Fällig heute',MB._klStatus,'MB.klFilterStatus')}${fbtn('alle','Alle',MB._klStatus,'MB.klFilterStatus')}${fbtn('neu','Neu',MB._klStatus,'MB.klFilterStatus')}${fbtn('nicht_erreicht','Nicht erreicht',MB._klStatus,'MB.klFilterStatus')}${fbtn('angerufen','Erreicht',MB._klStatus,'MB.klFilterStatus')}${fbtn('termin','Termin',MB._klStatus,'MB.klFilterStatus')}${fbtn('sperrliste','Sperrliste',MB._klStatus,'MB.klFilterStatus')}
          <span style="width:10px"></span>
          ${fbtn('alle','Kat: alle',MB._klKat,'MB.klFilterKat')}${fbtn('A','A',MB._klKat,'MB.klFilterKat')}${fbtn('B','B',MB._klKat,'MB.klFilterKat')}${fbtn('C','C',MB._klKat,'MB.klFilterKat')}
          <input placeholder="🔍 Firma oder Ort suchen…" value="${esc(MB._klSearch||'')}" onchange="MB._klSearch=this.value;render()" style="flex:1;min-width:160px">
        </div>
      </div>${rows}`;

  klFilterStatus(v){ MB._klStatus=v; render(); },
  klFilterKat(v){ MB._klKat=v; render(); },
  klSet(id,fld,val){ if(roGuard())return; const l=DB.read('mb_kaltliste',[]); const x=l.find(y=>y.id===id); if(!x)return; x[fld]=val; DB.write('mb_kaltliste',l); render(); },
  klErreicht(id){ if(roGuard())return; const l=DB.read('mb_kaltliste',[]); const x=l.find(y=>y.id===id); if(!x)return; x.status='angerufen'; x.wv=''; x.letzterKontakt=new Date().toISOString().slice(0,10); DB.write('mb_kaltliste',l); render(); },

  klNote(id){ openModal(`<div class="modal-head"><h2>Notiz zur Firma</h2><button class="x" onclick="closeModal()">×</button></div>

  klSaveNote(id){ if(roGuard())return; const t=document.getElementById('kl_txt').value.trim(); if(!t){closeModal();return;} const l=DB.read('mb_kaltliste',[]); const x=l.find(y=>y.id===id); if(!x)return; x.notiz=(x.notiz? x.notiz+' | ':'')+t; DB.write('mb_kaltliste',l); closeModal(); render(); },

  klDedupe(){ if(roGuard())return; const l=DB.read('mb_kaltliste',[]); const seen={}; const out=[];
    l.forEach(x=>{ const k=((x.place_id||((x.firma||'')+'|'+(x.adresse||'')))+'').toLowerCase(); if(seen[k])return; seen[k]=1; out.push(x); });
    const removed=l.length-out.length; DB.write('mb_kaltliste',out); alert(removed+' Dubletten entfernt.'); render(); },
  klAutoKat(){ if(roGuard())return;
    if(!confirm('Alle Firmen automatisch in A/B/C einstufen?\n\nA = online unsichtbar / kein Web / wenig sichtbar (Top-Ziel)\nB = mittel\nC = eher Handel/zu groß/geringe Eignung\n\nManuell gesetzte Einstufungen werden dabei überschrieben.')) return;
    const l=DB.read('mb_kaltliste',[]);
    const bad=/(handel|vertrieb|trading|shop|baumarkt|gebraucht|maschinenhandel|autohaus|schlüssel|entsorgung|schrott|zeitarbeit|personaldienst|immobilien|reinigung)/i;
    const owner=/(gmbh & co|e\.k\.|e\. k\.| ohg| inh\.| gebr\.)/i;
    l.forEach(x=>{
      const rev=parseInt(x.bewertungen)||0;
      const hasWeb=!!(x.website&&x.website.length>3);
      let s=0;
      if(!hasWeb) s+=2;
      if(rev<=8) s+=1;
      if(rev>150) s-=2;
      if(bad.test(x.firma||'')) s-=3;
      if(owner.test(x.firma||'')) s+=1;
      x.kategorie = s>=2?'A':(s<=-1?'C':'B');
    });
    DB.write('mb_kaltliste',l);
    const c={A:0,B:0,C:0}; l.forEach(x=>{c[x.kategorie]=(c[x.kategorie]||0)+1;});
    alert('Auto-Einstufung fertig:\n\n'+c.A+' × A  (zuerst anrufen)\n'+c.B+' × B\n'+c.C+' × C\n\nJede Einstufung ist per Dropdown überschreibbar.');
    render(); },

  _old_pipeline(){

  import(){

      <div class="card">
        <h3 style="margin-top:0">Schnell einfügen</h3>
        <p class="muted" style="font-size:12px">CSV-Inhalt direkt hier einfügen und importieren.</p>
        <textarea id="csvPaste" style="width:100%;min-height:160px" placeholder="firma;ansprech;tel;email;stadt;branche
Beispiel GmbH;Max Muster;+49 ...;mail@...;Berlin;CNC"></textarea>

  _after_import(){
    const f=document.getElementById('csvFile');
    if(f) f.addEventListener('change',e=>{
      const file=e.target.files[0]; if(!file)return;
      const r=new FileReader(); r.onload=()=>{ MB._csvText=r.result;
        const rows=MB.parseCSV(r.result);
        document.getElementById('importPreview').innerHTML=`<p class="muted" style="font-size:12px;margin-top:10px">Vorschau: <b>${rows.length}</b> Datensätze erkannt.</p>`;
      }; r.readAsText(file,'UTF-8');
    });
  },
  parseCSV(text){
    const lines=text.trim().split(/\r?\n/).filter(l=>l.trim());
    if(!lines.length) return [];
    const delim = (lines[0].split(';').length > lines[0].split(',').length)?';':',';
    const heads=lines[0].split(delim).map(h=>h.trim().toLowerCase());
    return lines.slice(1).map(line=>{
      const cells=line.split(delim);
      const o={}; heads.forEach((h,i)=>o[h]=(cells[i]||'').trim());
      return {id:uid(),firma:o.firma||o.firmenname||o.unternehmen||'',ansprech:o.ansprech||o.ansprechpartner||o.name||'',
        tel:o.tel||o.telefon||o.phone||'',email:o.email||o.mail||'',stadt:o.stadt||o.ort||o.city||'',branche:o.branche||o.bereich||'',
        software:o.software||'',wunsch:o.wunsch||o.bedarf||'',status:'neu',notes:[]};
    }).filter(x=>x.firma);
  },
  doImport(){ if(!MB._csvText){ alert('Bitte zuerst eine CSV-Datei wählen.'); return; } MB._merge(MB.parseCSV(MB._csvText)); },
  doImportPaste(){ const t=document.getElementById('csvPaste').value; if(!t.trim()){alert('Bitte CSV einfügen.');return;} MB._merge(MB.parseCSV(t)); },
  _merge(rows){
    if(!rows.length){ alert('Keine gültigen Datensätze gefunden.'); return; }
    const c=DB.read('contacts',[]); DB.write('contacts',[...rows,...c]);
    alert(rows.length+' Kontakte importiert.'); go('contacts');
  },

  compose(to='',subj='',body='',cc=''){

      <div class="field"><label>📎 Zusätzlich eigene Datei anhängen (optional, mehrere möglich)</label><input type="file" id="m_attach" multiple></div>

      <p class="muted" style="font-size:11px;margin-top:8px">Versand erfolgt im Live-Betrieb über all-inkl SMTP. Hier wird die Mail im Postfach (Ausgang) gespeichert.</p>`);

  async sendMail(){
    const to=document.getElementById('m_to').value, cc=document.getElementById('m_cc').value, subj=document.getElementById('m_subj').value, body=document.getElementById('m_body').value;
    if(!to){toast('Empfänger fehlt.',true);return;}
    let attachments=[];
    const checked=[...document.querySelectorAll('.pdflibchk:checked')].map(c=>c.value);
    if(checked.length){
      const lib=DB.read('mb_pdf_library',[]);
      checked.forEach(id=>{ const p=lib.find(x=>x.id===id); if(p&&p.data){ attachments.push({filename:p.name, content:String(p.data).split(',')[1]}); } });
    }
    const fi=document.getElementById('m_attach');
    if(fi && fi.files && fi.files.length){
      try {
        for(const f of fi.files){
          const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f);});
          attachments.push({filename:f.name, content:b64});
        }
      } catch(e){ toast('Anhang konnte nicht gelesen werden.',true); return; }
    }
    try {

  async savePost(id){
    if(roGuard())return;
    const m=DB.read('mb_marketing',[]);
    const existing=id?m.find(v=>v.id===id):null;
    const data={kanal:document.getElementById('po_kanal').value,text:document.getElementById('po_text').value,status:document.getElementById('po_status').value,date:new Date(document.getElementById('po_date').value).getTime()};
    // Bild optional mit hochladen, damit ein automatischer Auto-Publish-Cron es später für Instagram/Facebook nutzen kann
    const fileEl=document.getElementById('po_img');
    const file=fileEl&&fileEl.files&&fileEl.files[0];
    if(file){
      try{
        const dataUrl=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(file);});
        const comma=dataUrl.indexOf(',');
        const contentType=(dataUrl.slice(5,comma).split(';')[0])||'image/jpeg';
        const dataBase64=dataUrl.slice(comma+1);
        const imgKey='img_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
        await apiPut(imgKey,{contentType,dataBase64});
        data.imageUrl=API_BASE+'/social-post?img='+encodeURIComponent(imgKey);
      }catch(e){ toast('Bild konnte nicht gespeichert werden: '+e.message); }
    } else if(existing&&existing.imageUrl){ data.imageUrl=existing.imageUrl; }
    if(id){const x=m.find(v=>v.id===id);Object.assign(x,data);} else m.unshift({id:uid(),...data});
    DB.write('mb_marketing',m); closeModal(); render();
  },
  async publishPost(id){
    if(roGuard())return;
    const kanal=document.getElementById('po_kanal').value;
    const text=document.getElementById('po_text').value.trim();
    const platMap={Instagram:'instagram',Facebook:'facebook',LinkedIn:'linkedin'};
    const platform=platMap[kanal];
    if(!platform){ toast(kanal==='TikTok'?'TikTok-Direktposten folgt, sobald die API-Freigabe da ist – Beitrag als „geplant" speichern.':'Direkt-Posten geht nur für Instagram, Facebook oder LinkedIn'); return; }
    if(!text){ toast('Bitte Beitragstext eingeben'); return; }
    const fileEl=document.getElementById('po_img');
    const file=fileEl&&fileEl.files&&fileEl.files[0];
    if((platform==='instagram'||platform==='facebook')&&!file&&platform==='instagram'){ toast('Instagram braucht ein Bild'); return; }
    toast('Wird veröffentlicht … bitte kurz warten');
    let imageUrl=null;
    try{
      if(file){
        const dataUrl=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(file);});
        const comma=dataUrl.indexOf(',');
        const meta=dataUrl.slice(5,comma); // e.g. image/jpeg;base64
        const contentType=meta.split(';')[0]||'image/jpeg';
        const dataBase64=dataUrl.slice(comma+1);
        const imgKey='img_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
        await apiPut(imgKey,{contentType,dataBase64});
        imageUrl=API_BASE+'/social-post?img='+encodeURIComponent(imgKey);
      }
      const body={platform,caption:text}; if(imageUrl) body.imageUrl=imageUrl;
      const r=await fetch(API_BASE+'/social-post',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':API_KEY},body:JSON.stringify(body)});
      const j=await r.json().catch(()=>({}));
      if(!r.ok||!j.ok){ toast('Fehler: '+((j&&j.error)||('HTTP '+r.status))); return; }
      const m=DB.read('mb_marketing',[]);
      const rec={kanal,text,status:'veröffentlicht',date:Date.now(),postId:j.id};
      if(id){const x=m.find(v=>v.id===id);if(x)Object.assign(x,rec);} else m.unshift({id:uid(),...rec});
      DB.write('mb_marketing',m);
      toast('✓ Veröffentlicht auf '+kanal); closeModal(); render();
    }catch(e){ toast('Fehler: '+e.message); }
  },
  delPost(id){ DB.write('mb_marketing',DB.read('mb_marketing',[]).filter(x=>x.id!==id)); closeModal(); render(); },

/* ============================================================
   MPU-MASKE
   ============================================================ */
let CLI_FILTER='alle'; // 'alle' | 'mit' | 'ohne' – Abstinenz-Filter in der Kundenkartei
const MPU = {
  abstEnd(c){ const d=new Date(c.abstinenzStart); d.setMonth(d.getMonth()+c.abstinenzMonate); return d; },
  abstDaysLeft(c){ return Math.ceil((MPU.abstEnd(c)-new Date())/86400000); },
  needsAbst(c){ return c.abstinenzNoetig!==false; },
  abstChip(c){
    if(!MPU.needsAbst(c)) return `<span class="chip">🚫 Keine Abstinenz nötig</span>`;
    const d=MPU.abstDaysLeft(c);
    if(d<=0) return `<span class="badge b-abschluss">✅ Abstinenz erreicht</span>`;
    if(d<=30) return `<span class="badge b-offen">⏰ noch ${d} Tg.</span>`;
    return `<span class="chip">🧪 noch ${d} Tg. (${c.abstinenzMonate} Mon. seit ${fmtDate(c.abstinenzStart)})</span>`;
  },
  setCliFilter(v){ CLI_FILTER=v; MPU.filterClients(document.getElementById('cliSearch')?document.getElementById('cliSearch').value:''); },
  clients(){
    const cl=DB.read('mpu_clients',[]);
    const withAbst=cl.filter(MPU.needsAbst);
    const warn=withAbst.map(c=>({c,d:MPU.abstDaysLeft(c)})).filter(x=>x.d<=30);
    const warnBanner = warn.length? `<div class="banner alert">⏰ <b>Abstinenz-Fristen:</b> ${warn.map(x=>`<a onclick="MPU.openClient('${x.c.id}')" style="cursor:pointer">${esc(x.c.name)} – ${x.d<0?'überfällig seit '+Math.abs(x.d)+' Tg.':'noch '+x.d+' Tg.'} (Ende ${fmtDate(MPU.abstEnd(x.c))})</a>`).join(' · ')}</div>`:'';
    const tOffen=cl.reduce((s,c)=>s+Math.max(0,(c.stundenGesamt||0)-(c.stundenGemacht||0)),0);
    const tGemacht=cl.reduce((s,c)=>s+(c.stundenGemacht||0),0);
    const tGesamt=cl.reduce((s,c)=>s+(c.stundenGesamt||0),0);
    const nOhne=cl.length-withAbst.length;
    return head('Kundenkartei','Name oben eingeben, Akte einsehen – Downloads sind gesperrt. Standardmäßig nach offenen Stunden sortiert.',
      `<button class="btn" onclick="MPU.editClient()">+ Kunde</button>`)+
      warnBanner+`
      <div class="cards grid-4" style="margin-bottom:16px">
        <div class="card kpi"><span class="lbl">Kunden gesamt</span><span class="val">${cl.length}</span></div>
        <div class="card kpi"><span class="lbl">Offene Stunden (alle)</span><span class="val">${tOffen}</span><span class="sub">von ${tGesamt} gesamt</span></div>
        <div class="card kpi"><span class="lbl">Absolviert (alle)</span><span class="val">${tGemacht}</span></div>
        <div class="card kpi"><span class="lbl">Ohne Abstinenz nötig</span><span class="val">${nOhne}</span></div>
      </div>
      <div class="socchips">
        <button class="socchip${CLI_FILTER==='alle'?' active':''}" onclick="MPU.setCliFilter('alle')"><span>🗂️ Alle</span><span class="cnt">${cl.length}</span></button>
        <button class="socchip${CLI_FILTER==='mit'?' active':''}" onclick="MPU.setCliFilter('mit')"><span>🧪 Mit Abstinenz</span><span class="cnt">${withAbst.length}</span></button>
        <button class="socchip${CLI_FILTER==='ohne'?' active':''}" onclick="MPU.setCliFilter('ohne')"><span>🚫 Ohne Abstinenz</span><span class="cnt">${nOhne}</span></button>
      </div>
      <div class="card" style="margin-bottom:16px">
        <div class="field" style="margin:0"><label>🔎 Kunde suchen (Name)</label><input id="cliSearch" placeholder="Name eingeben…" oninput="MPU.filterClients(this.value)"></div>
      </div>
      <div id="cliResults"></div>`;
  },
  _after_clients(){ MPU.filterClients(''); },
  filterClients(q){
    let cl=DB.read('mpu_clients',[]).filter(c=>c.name.toLowerCase().includes((q||'').toLowerCase()));
    if(CLI_FILTER==='mit') cl=cl.filter(MPU.needsAbst);
    else if(CLI_FILTER==='ohne') cl=cl.filter(c=>!MPU.needsAbst(c));
    // Überblick: die meisten offenen Stunden zuerst
    cl=cl.slice().sort((a,b)=>((b.stundenGesamt||0)-(b.stundenGemacht||0))-((a.stundenGesamt||0)-(a.stundenGemacht||0)));
    const host=document.getElementById('cliResults'); if(!host)return;
    host.innerHTML = cl.length? `<div class="cards grid-3">${cl.map(c=>{
      const rest=c.stundenGesamt-c.stundenGemacht;
      return `<div class="card clickrow" onclick="MPU.openClient('${c.id}')">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><h3 style="margin:0 0 4px">${esc(c.name)}</h3>${scorePill(c)}</div>
        <p class="muted" style="font-size:12px;margin:0 0 10px">${esc(c.anlass)} · ${esc(c.tel)}</p>
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>Stunden ${c.stundenGemacht}/${c.stundenGesamt}</span><b>${rest} offen</b></div>
        <div class="progress"><div style="width:${c.stundenGesamt?c.stundenGemacht/c.stundenGesamt*100:0}%"></div></div>
        <div style="margin-top:10px">${MPU.abstChip(c)}</div>
        <p class="muted" style="font-size:11px;margin:10px 0 0">${c.akten.length} Akte(n) · ${c.zertifikate.length} Bescheinigung(en)</p>
      </div>`;}).join('')}</div>` : '<div class="empty">Kein Kunde gefunden.</div>';
  },
  openClient(id){
    const c=DB.read('mpu_clients',[]).find(x=>x.id===id);
    const rest=c.stundenGesamt-c.stundenGemacht;
    const abEnd=new Date(c.abstinenzStart); abEnd.setMonth(abEnd.getMonth()+c.abstinenzMonate);
    const now=new Date(); const ms=abEnd-now; const tageRest=Math.max(0,Math.ceil(ms/86400000));
    const gesamtTage=c.abstinenzMonate*30; const verg=Math.min(100,Math.max(0,(gesamtTage-tageRest)/gesamtTage*100));
    openModal(`
      <div class="modal-head"><h2>${esc(c.name)} <span class="muted" style="font-size:13px">· geb. ${esc(c.geb)}</span></h2><button class="x" onclick="closeModal()">×</button></div>
      <div class="tabbar">
        <button class="active" onclick="MPU.tab(event,'t-akte','${id}')">Akte</button>
        <button onclick="MPU.tab(event,'t-abst','${id}')">Abstinenz</button>
        <button onclick="MPU.tab(event,'t-sess','${id}')">Sitzungen</button>
        <button onclick="MPU.tab(event,'t-zert','${id}')">Bescheinigungen</button>
      </div>
      <div id="cliTabs">
        <div id="t-akte">
          <p class="muted" style="font-size:12px">📵 Dokumente können eingesehen, aber <b>nicht heruntergeladen</b> werden.</p>
          ${c.akten.map(a=>`<div class="list-plain"><li class="nodl" style="cursor:pointer" onclick="MPU.viewDoc('${esc(a.name)}','Akte')"><span style="display:flex;align-items:center;gap:10px"><span class="fileicon">📄</span>${esc(a.name)}</span><span class="muted" style="font-size:12px">${fmtDate(a.date)} · <span class="chip">👁 ansehen</span></span></li></div>`).join('')||'<p class="muted">Keine Akten.</p>'}
          <div class="row" style="margin-top:12px;align-items:flex-end">
            <div class="field" style="flex:1;margin:0"><label>Dokument zur Akte hinzufügen</label><input type="file" id="akteFile"></div>
            <button class="btn sm" onclick="MPU.uploadAkte('${id}')">Hochladen</button>
          </div>
          <div class="row" style="margin-top:14px"><div class="field"><label>Telefon</label><div>${esc(c.tel)}</div></div><div class="field"><label>E-Mail</label><div>${esc(c.email)}</div></div></div>
          <div class="flexbtns" style="margin-top:10px">
            <button class="btn gray sm" onclick="MPU.editClient('${id}')">Stammdaten bearbeiten</button>
            <button class="btn sm" id="kiAkteBtn" onclick="kiAkteZusammenfassen('${id}')">✨ Akte zusammenfassen (KI)</button>
          </div>
        </div>
        <div id="t-abst" class="hidden">
          ${!MPU.needsAbst(c)?`
          <div class="banner">🚫 <b>Für diesen Kunden ist kein Abstinenznachweis nötig</b> (Anlass: ${esc(c.anlass)}).</div>
          <button class="btn gray sm" style="margin-top:10px" onclick="MPU.editClient('${id}')">Anpassen</button>
          `:`
          <div class="cards grid-2">
            <div class="card kpi"><span class="lbl">Abstinenz-Dauer</span><span class="val">${c.abstinenzMonate} Mon.</span><span class="sub">${esc(c.anlass)}</span></div>
            <div class="card kpi"><span class="lbl">Verbleibend</span><span class="val">${tageRest} Tage</span><span class="sub">bis ${fmtDate(abEnd)}</span></div>
          </div>
          <div style="margin-top:14px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px"><span>Fortschritt Abstinenz</span><b>${Math.round(verg)}%</b></div><div class="progress"><div style="width:${verg}%"></div></div></div>
          ${tageRest<=0?`<div class="banner alert" style="margin-top:12px">✅ Abstinenzzeitraum <b>erreicht</b> (Ende ${fmtDate(abEnd)}). Nachweis kann eingereicht werden.</div>`:tageRest<=30?`<div class="banner alert" style="margin-top:12px">⏰ Abstinenz endet in <b>${tageRest} Tagen</b> – Nachweis/Folgetermin vorbereiten.</div>`:''}
          <div class="banner" style="margin-top:16px">💡 <b>Empfehlung:</b> Bei <b>Alkohol</b> meist <b>12 Monate</b> Abstinenznachweis, bei <b>Drogen/Cannabis</b> i.d.R. <b>6 Monate</b> (bei Abhängigkeit 12). Hier frei pro Kunde einstellbar.</div>
          <button class="btn gray sm" style="margin-top:10px" onclick="MPU.editClient('${id}')">Abstinenz anpassen</button>
          `}
        </div>
        <div id="t-sess" class="hidden">
          <div class="card kpi" style="margin-bottom:14px"><span class="lbl">Stunden</span><span class="val">${c.stundenGemacht} / ${c.stundenGesamt} <span style="font-size:14px;color:var(--warn)">(${rest} ausstehend)</span></span></div>
          <button class="btn sm" onclick="MPU.addSession('${id}')">+ Sitzung dokumentieren</button>
          <div style="margin-top:12px">${c.sessions.slice().reverse().map(s=>`<div class="note-item"><div class="meta">${fmtDateTime(s.t)} · <b>${esc(s.thema)}</b></div>${esc(s.notiz)}</div>`).join('')||'<p class="muted">Noch keine Sitzungen.</p>'}</div>
        </div>
        <div id="t-zert" class="hidden">
          <p class="muted" style="font-size:12px">Teilnahmebescheinigungen hochladen (bleiben im System, kein Download durch Kunden).</p>
          <input type="file" id="zertFile" class="field" style="width:100%">
          <button class="btn sm" onclick="MPU.uploadZert('${id}')">Hochladen</button>
          <div style="margin-top:12px">${c.zertifikate.map(z=>`<div class="list-plain"><li class="nodl" style="cursor:pointer" onclick="MPU.viewDoc('${esc(z.name)}','Teilnahmebescheinigung')"><span style="display:flex;align-items:center;gap:10px"><span class="fileicon">📜</span>${esc(z.name)}</span><span class="muted" style="font-size:12px">${fmtDate(z.date)} · <span class="chip">👁 ansehen</span></span></li></div>`).join('')||'<p class="muted">Noch keine Bescheinigungen.</p>'}</div>
        </div>
      </div>`,true);
  },
  tab(ev,target,id){
    document.querySelectorAll('.tabbar button').forEach(b=>b.classList.remove('active')); ev.target.classList.add('active');
    document.querySelectorAll('#cliTabs > div').forEach(d=>d.classList.add('hidden'));
    document.getElementById(target).classList.remove('hidden');
  },
  addSession(id){
    openModal(`<div class="modal-head"><h2>Sitzung dokumentieren</h2><button class="x" onclick="closeModal()">×</button></div>
      <div class="field"><label>Thema</label><input id="se_thema"></div>
      <div class="field"><label>Was wurde besprochen?</label><textarea id="se_notiz" style="min-height:120px"></textarea></div>
      <button class="btn" onclick="MPU.saveSession('${id}')">Speichern (zählt 1 Stunde)</button>`);
  },
  saveSession(id){
    if(roGuard())return;
    const cl=DB.read('mpu_clients',[]); const c=cl.find(x=>x.id===id);
    const thema=document.getElementById('se_thema').value||'Sitzung';
    c.sessions.push({t:Date.now(),thema,notiz:document.getElementById('se_notiz').value});
    c.stundenGemacht=Math.min(c.stundenGesamt,c.stundenGemacht+1);
    DB.write('mpu_clients',cl); logActivity('session','client',id,c.name,'Sitzung dokumentiert: '+thema); MPU.openClient(id); render();
  },
  uploadZert(id){
    if(roGuard())return;
    const f=document.getElementById('zertFile'); if(!f.files[0]){alert('Bitte Datei wählen.');return;}
    const cl=DB.read('mpu_clients',[]); const c=cl.find(x=>x.id===id);
    c.zertifikate.push({name:f.files[0].name,date:Date.now()});
    DB.write('mpu_clients',cl); MPU.openClient(id);
  },
  viewDoc(name,kind){
    openModal(`<div class="modal-head"><h2>👁 ${esc(kind)}</h2><button class="x" onclick="closeModal()">×</button></div>
      <div class="banner alert">🔒 Vertraulich – nur Ansicht. <b>Kein Download, kein Druck, kein Kopieren.</b></div>
      <div style="position:relative;background:#fff;color:#111;border-radius:8px;padding:34px 30px;min-height:300px;user-select:none;pointer-events:none;overflow:hidden" oncontextmenu="return false">
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;color:rgba(200,0,0,.12);transform:rotate(-25deg);font-weight:800;letter-spacing:3px">NUR ANSICHT · VERTRAULICH</div>
        <div style="font-weight:700;font-size:16px;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:14px">${esc(name)}</div>
        <p style="font-size:13px;line-height:1.7;color:#333">Dies ist die geschützte Dokumentenvorschau. Im Live-Betrieb wird hier der echte PDF-Inhalt eingebettet angezeigt (z.B. als Bild-Rendering ohne Datei­zugriff), sodass der Inhalt einsehbar, aber nicht herunterladbar ist.</p>
        <p style="font-size:13px;line-height:1.7;color:#333">Dokument: <b>${esc(name)}</b><br>Status: gespeichert in der Kundenakte<br>Sichtbarkeit: nur berechtigte Berater</p>
      </div>
      <p class="muted" style="font-size:11px;margin-top:10px">Hinweis: Ein vollständiger Download-Schutz ist nur mit serverseitigem Dokument-Viewer technisch sicher umsetzbar. Diese Vorschau ist der Prototyp dafür.</p>`,true);
  },
  uploadAkte(id){
    if(roGuard())return;
    const f=document.getElementById('akteFile'); if(!f.files[0]){alert('Bitte Datei wählen.');return;}
    const cl=DB.read('mpu_clients',[]); const c=cl.find(x=>x.id===id);
    c.akten.push({name:f.files[0].name,typ:'pdf',date:Date.now()});
    DB.write('mpu_clients',cl); MPU.openClient(id);
  },
  editClient(id){
    const cl=DB.read('mpu_clients',[]); const c=id?cl.find(x=>x.id===id):{name:'',geb:'',tel:'',email:'',anlass:'Alkohol',abstinenzNoetig:true,abstinenzMonate:12,abstinenzStart:isoIn(0),stundenGesamt:10,stundenGemacht:0,sessions:[],akten:[],zertifikate:[]};
    const noetig=MPU.needsAbst(c);
    openModal(`<div class="modal-head"><h2>${id?'Stammdaten':'Neuer Kunde'}</h2><button class="x" onclick="closeModal()">×</button></div>
      <div class="row"><div class="field"><label>Name</label><input id="k_name" value="${esc(c.name)}"></div><div class="field"><label>Geburtsdatum</label><input type="date" id="k_geb" value="${esc(c.geb)}"></div></div>
      <div class="row"><div class="field"><label>Telefon</label><input id="k_tel" value="${esc(c.tel)}"></div><div class="field"><label>E-Mail</label><input id="k_email" value="${esc(c.email)}"></div></div>
      <div class="row"><div class="field"><label>Anlass</label><select id="k_anlass"><option ${c.anlass==='Alkohol'?'selected':''}>Alkohol</option><option ${c.anlass.includes('Drogen')?'selected':''}>Drogen (Cannabis)</option><option ${c.anlass==='Punkte'?'selected':''}>Punkte</option><option ${c.anlass==='Straftat'?'selected':''}>Straftat</option></select></div></div>
      <label style="display:flex;align-items:center;gap:8px;margin:6px 0 10px;cursor:pointer"><input type="checkbox" id="k_abnoetig" ${noetig?'checked':''} onchange="document.getElementById('abstFields').style.display=this.checked?'flex':'none'" style="width:auto"> Abstinenznachweis für diesen Kunden erforderlich</label>
      <div class="row" id="abstFields" style="display:${noetig?'flex':'none'}">
        <div class="field"><label>Abstinenz (Monate)</label><input type="number" id="k_abm" value="${c.abstinenzMonate||12}"></div>
        <div class="field"><label>Abstinenz-Start</label><input type="date" id="k_abs" value="${esc(c.abstinenzStart||isoIn(0))}"></div>
      </div>
      <div class="row"><div class="field"><label>Stunden gesamt (gebucht)</label><input type="number" id="k_sg" value="${c.stundenGesamt}"></div><div class="field"><label>Stunden gemacht</label><input type="number" id="k_sm" value="${c.stundenGemacht}"></div></div>
      <div class="flexbtns"><button class="btn" onclick="MPU.saveClient('${id||''}')">Speichern</button>${id?`<button class="btn danger" onclick="MPU.delClient('${id}')">Löschen</button>`:''}</div>`,true);
  },
  saveClient(id){
    if(roGuard())return;
    const cl=DB.read('mpu_clients',[]);
    const data={name:document.getElementById('k_name').value,geb:document.getElementById('k_geb').value,tel:document.getElementById('k_tel').value,email:document.getElementById('k_email').value,anlass:document.getElementById('k_anlass').value,abstinenzNoetig:document.getElementById('k_abnoetig').checked,abstinenzMonate:+document.getElementById('k_abm').value,abstinenzStart:document.getElementById('k_abs').value,stundenGesamt:+document.getElementById('k_sg').value,stundenGemacht:+document.getElementById('k_sm').value};
    if(!data.name){alert('Name fehlt.');return;}
    if(id){const c=cl.find(x=>x.id===id);Object.assign(c,data);} else cl.unshift({id:uid(),...data,sessions:[],akten:[],zertifikate:[]});
    DB.write('mpu_clients',cl); closeModal(); render();
  },
  delClient(id){ if(roGuard())return; if(!confirm('Kunde löschen?'))return; DB.write('mpu_clients',DB.read('mpu_clients',[]).filter(x=>x.id!==id)); closeModal(); render(); },

  sessions(){
    const cl=DB.read('mpu_clients',[]);
    const all=cl.flatMap(c=>c.sessions.map(s=>({...s,name:c.name}))).sort((a,b)=>b.t-a.t);
    return head('Sitzungen & Stunden','Alle dokumentierten Stunden im Überblick')+`
      <div class="cards grid-3" style="margin-bottom:16px">
        <div class="card kpi"><span class="lbl">Kunden aktiv</span><span class="val">${cl.length}</span></div>
        <div class="card kpi"><span class="lbl">Stunden gemacht</span><span class="val">${cl.reduce((s,c)=>s+c.stundenGemacht,0)}</span></div>
        <div class="card kpi"><span class="lbl">Stunden ausstehend</span><span class="val" style="color:var(--warn)">${cl.reduce((s,c)=>s+(c.stundenGesamt-c.stundenGemacht),0)}</span></div>
      </div>
      <div class="card" style="padding:0;overflow:hidden"><table><thead><tr><th>Datum</th><th>Kunde</th><th>Thema</th><th>Notiz</th></tr></thead>
      <tbody>${all.map(s=>`<tr><td>${fmtDateTime(s.t)}</td><td><b>${esc(s.name)}</b></td><td>${esc(s.thema)}</td><td>${esc(s.notiz)}</td></tr>`).join('')||'<tr><td colspan="4"><div class="empty">Noch keine Sitzungen</div></td></tr>'}</tbody></table></div>`;
  },

  video(){
    const link=DB.read('mpu_videolink','');
    return head('Video-Beratung','Ein zentraler Raum für Teams / Zoom / Google Meet')+`
      <div class="card" style="max-width:640px">
        <h3 style="margin-top:0">Zentraler Video-Link</h3>
        <p class="muted" style="font-size:13px">Empfehlung: <b>ein fester Raum-Link</b> für alle Beratungen – am einfachsten für Kunden, kein neuer Link pro Termin. Google Meet oder Zoom Personal Meeting Room eignen sich gut.</p>
        <div class="field"><label>Raum-Link</label><input id="vidLink" value="${esc(link)}"></div>
        <div class="flexbtns">

          <button class="btn gray" onclick="DB.write('mpu_videolink',document.getElementById('vidLink').value);alert('Gespeichert.')">Speichern</button>
        </div>
        <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">
          <a class="chip" href="https://meet.google.com/new" target="_blank">Google Meet</a>
          <a class="chip" href="https://zoom.us/start/videomeeting" target="_blank">Zoom</a>
          <a class="chip" href="https://teams.microsoft.com" target="_blank">MS Teams</a>
        </div>
      </div>`;
  },

  mpu_mail(){
    const all=DB.read('mpu_mails',[]);
    const boxes=DB.read('mpu_mailboxes',[]);
    const folder=window.MPU_folder||'inbox';
    const counts={
      inbox:  all.filter(m=>m.box!=='trash'&&m.box!=='spam'&&m.box!=='failed'&&m.dir!=='out').length,
      sent:   all.filter(m=>m.box!=='trash'&&m.box!=='spam'&&m.box!=='failed'&&m.dir==='out').length,
      spam:   all.filter(m=>m.box==='spam').length,
      failed: all.filter(m=>m.box==='failed').length,
      trash:  all.filter(m=>m.box==='trash').length
    };
    const mails=all.filter(m=>{
      if(m.box==='trash')  return folder==='trash';
      if(m.box==='spam')   return folder==='spam';
      if(m.box==='failed') return folder==='failed';
      if(folder==='sent')  return m.dir==='out';
      if(folder==='inbox') return m.dir!=='out';
      return false;
    });
    const ftab=(id,label,ico)=>`<button class="btn sm ${folder===id?'':'gray'}" onclick="mpuSetFolder('${id}')">${ico} ${label} (${counts[id]})</button>`;
    return head('E-Mail (all-inkl)','Kommunikation mit MPU-Kunden – eigenes Postfach',
      `<button class="btn" onclick="MPU.compose()">+ Neue E-Mail</button> <button class="btn gray" id="mpuInboxBtn" onclick="mpuFetchInbox()">📥 Posteingang abrufen</button> <button class="btn gray" onclick="MPU.newMailbox()">📮 Postfach anlegen</button>`)+`
      <div class="flexbtns" style="margin-bottom:12px;flex-wrap:wrap">${ftab('inbox','Posteingang','📥')} ${ftab('sent','Gesendet','➡️')} ${ftab('spam','Spam','🚫')} ${ftab('failed','Nicht gesendet','⚠️')} ${ftab('trash','Gelöscht','🗑️')}</div>
      ${boxes.length?`<div class="banner">📮 <b>Angelegte Postfächer:</b> ${boxes.map(b=>`<span class="chip">${esc(b.adresse)} (${esc(b.fuer)})</span>`).join(' ')}</div>`:''}
      <div class="maillist">
        <div class="list" id="mpuMailList">${mails.map((m,i)=>`<div class="mailrow ${i===0?'active':''}" onclick="MPU.showMail('${m.id}')">
          <div class="from">${m.dir==='out'?'➡️ ':''}${esc(m.from)} ${m.read?'':'<span class="badge b-neu" style="font-size:9px">neu</span>'}</div>
          <div class="subj">${esc(m.subj)}</div><div class="muted" style="font-size:11px">${fmtDateTime(m.date)}</div></div>`).join('')||'<div class="empty">Kein E-Mail</div>'}</div>

  _body(m){

      ? `<button class="btn sm" onclick="mpuMailAction('${m.id}','restore')">↩️ Wiederherstellen</button> <button class="btn sm danger" onclick="mpuMailAction('${m.id}','delete')">Endgültig löschen</button>`
      : m.box==='failed'
      ? `<button class="btn sm" onclick="mpuRetrySend('${m.id}')">🔁 Erneut senden</button> <button class="btn sm gray" onclick="mpuDiscardFailed('${m.id}')">🗑️ Entwurf verwerfen</button>`
      : `<button class="btn sm" onclick="MPU.compose('${esc(m.email)}','Re: ${esc(m.subj)}')">Antworten</button> `
        + (m.box==='spam'
            ? `<button class="btn sm gray" onclick="mpuMailAction('${m.id}','notspam')">Kein Spam</button> `
            : `<button class="btn sm gray" onclick="mpuMailAction('${m.id}','spam')">🚫 Spam</button> `)
        + `<button class="btn sm gray" onclick="mpuMailAction('${m.id}','trash')">🗑️ Löschen</button>`;
    const attHtml=(m.attach&&m.attach.length)?`<div class="muted" style="font-size:12px;margin-top:12px">📎 Anhänge: ${m.attach.map(esc).join(', ')}</div>`:'';
    const ccHtml=m.cc?`<br>Cc: ${esc(m.cc)}`:'';
    const failHtml=m.box==='failed'?`<div class="banner" style="margin-top:12px">⚠️ <b>Nicht gesendet:</b> ${esc(m.error||'Unbekannter Fehler')}</div>`:'';
    return `<button class="btn sm gray back-btn-mobile" onclick="mobileShowList('mpuMailView')">← Zurück</button><h3 style="margin-top:0">${esc(m.subj)}</h3><p class="muted" style="font-size:12px">${m.dir==='out'?'An':'Von'}: ${esc(m.from)} &lt;${esc(m.email)}&gt;${ccHtml} · ${fmtDateTime(m.date)}</p>${failHtml}<div style="white-space:pre-wrap;margin-top:12px;line-height:1.6">${esc(m.body)}</div>${attHtml}<div style="margin-top:14px">${actions}</div>`;
  },
  showMail(id){ const m=DB.read('mpu_mails',[]).find(x=>x.id===id); m.read=true; DB.write('mpu_mails',DB.read('mpu_mails',[]).map(x=>x.id===id?m:x)); document.getElementById('mpuMailView').innerHTML=MPU._body(m); document.querySelectorAll('#mpuMailList .mailrow').forEach(r=>r.classList.remove('active')); event.currentTarget.classList.add('active'); mobileShowDetail('mpuMailView'); },
  compose(to='',subj='',body='',cc=''){
    openModal(`<div class="modal-head"><h2>Neue E-Mail</h2><button class="x" onclick="closeModal()">×</button></div>
      <div class="field"><label>An</label><input id="mp_to" value="${esc(to)}" placeholder="kunde@mail.de"></div>
      <div class="field"><label>Cc (optional)</label><input id="mp_cc" value="${esc(cc)}" placeholder="weitere@empfaenger.de"></div>

      ${(()=>{ const lib=DB.read('mpu_pdf_library',[]); return lib.length? `
      <div class="field"><label>📚 Aus PDF-Bibliothek anhängen</label>

      <div class="field"><label>📎 Zusätzlich eigene Datei anhängen (optional, mehrere möglich)</label><input type="file" id="mp_attach" multiple></div>
      <div class="flexbtns"><button class="btn" onclick="MPU.sendMail()">Senden</button><button class="btn ghost" onclick="closeModal()">Abbrechen</button></div>
      <p class="muted" style="font-size:11px;margin-top:8px">Versand erfolgt im Live-Betrieb über all-inkl SMTP. Hier wird die Mail im Postfach (Ausgang) gespeichert.</p>`);
  },
  async sendMail(){
    const to=document.getElementById('mp_to').value, cc=document.getElementById('mp_cc').value, subj=document.getElementById('mp_subj').value, body=document.getElementById('mp_body').value;
    if(!to){toast('Empfänger fehlt.',true);return;}
    let attachments=[];
    const checked=[...document.querySelectorAll('.mpupdflibchk:checked')].map(c=>c.value);
    if(checked.length){
      const lib=DB.read('mpu_pdf_library',[]);
      checked.forEach(id=>{ const p=lib.find(x=>x.id===id); if(p&&p.data){ attachments.push({filename:p.name, content:String(p.data).split(',')[1]}); } });
    }
    const fi=document.getElementById('mp_attach');
    if(fi && fi.files && fi.files.length){
      try {
        for(const f of fi.files){
          const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f);});
          attachments.push({filename:f.name, content:b64});
        }
      } catch(e){ toast('Anhang konnte nicht gelesen werden.',true); return; }
    }
    try {
      const r=await fetch(`${API_BASE}/send-message`,{method:'POST',headers:{'Content-Type':'application/json','x-api-key':API_KEY},body:JSON.stringify({channel:'email',to,cc,subject:subj,body,attachments,division:'mpu'})});
      const j=await r.json();
      if(!r.ok||j.error) throw new Error(j.error||'Versand fehlgeschlagen');
    } catch(e){
      const mails=DB.read('mpu_mails',[]); mails.unshift({id:uid(),from:'MPU-Beratung',email:to,cc,subj,body,date:Date.now(),read:true,dir:'out',box:'failed',error:e.message,attach:attachments.map(a=>a.filename)});
      DB.write('mpu_mails',mails); closeModal(); render();
      toast('Versand fehlgeschlagen – unter „Nicht gesendet" abgelegt: '+e.message,true);
      return;
    }
    const mails=DB.read('mpu_mails',[]); mails.unshift({id:uid(),from:'MPU-Beratung',email:to,cc,subj,body,date:Date.now(),read:true,dir:'out',attach:attachments.map(a=>a.filename)});
    DB.write('mpu_mails',mails); logActivity('mail','mail','',to,'E-Mail gesendet: '+subj); closeModal(); render(); toast('E-Mail an '+to+' gesendet'+(attachments.length?' (mit '+attachments.length+' Anhang)':'')+'.');
  },

function ensureCalCss(){ if(document.getElementById('wkcss'))return; const s=document.createElement('style'); s.id='wkcss'; s.textContent=`
.calbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.calttl{font-size:15px;font-weight:600;text-transform:capitalize}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.sm.active{background:var(--accent);color:#fff}
.wk{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.wk-corner,.wk-dh,.wk-hl{background:var(--panel2)}
.wk-dh{padding:8px 4px;text-align:center;font-size:12px;font-weight:600}
.wk-dh span{display:block;color:var(--muted);font-weight:400;font-size:11px}
.wk-dh.today{color:var(--accent)}
.wk-hl{padding:6px 6px;font-size:11px;color:var(--muted);text-align:right}
.wk-cell{background:var(--panel);min-height:34px;padding:2px;cursor:pointer}
.wk-cell:hover{background:var(--panel2)}
.wk-ev{color:#fff;border-radius:6px;padding:3px 6px;margin:2px 0;font-size:12px;cursor:pointer;line-height:1.3}
.wk-firma{opacity:.85}
`; document.head.appendChild(s); }
function isoOf(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function calState(){ if(!window.__cal) window.__cal={mode:'week',ref:isoIn(0)}; return window.__cal; }
function setCalMode(m){ calState().mode=m; render(); }
function calToday(){ calState().ref=isoIn(0); render(); }
function calNav(dir){ const s=calState(); const d=new Date(s.ref+'T00:00'); if(s.mode==='month') d.setMonth(d.getMonth()+dir); else if(s.mode==='week') d.setDate(d.getDate()+7*dir); else d.setDate(d.getDate()+dir); s.ref=isoOf(d); render(); }
function calEvColor(e){ if(e._blocked) return 'var(--warn)'; return e.bereich==='mpu'?'var(--mpu)':(e.bereich==='mb'?'var(--mb)':(e.typ==='priv'?'var(--muted)':'var(--accent)')); }
function webTermineEvents(){ const arr=window.__webTermine||[]; return arr.map(t=>({id:'wb_'+(t.id||''),date:t.date,time:(t.startTime||'').slice(0,5),title:(t.name||'Buchung')+(t.anliegen?' – '+t.anliegen:''),firma:t.firma||'',_blocked:true})); }
function loadWebTermine(){ if(window.__webLoading||Array.isArray(window.__webTermine))return; window.__webLoading=true; fetch(API_BASE+'/data?key=website_termine',{headers:{'x-api-key':API_KEY}}).then(r=>r.json()).then(j=>{window.__webTermine=(j&&j.value)||[];window.__webLoading=false;if(typeof render==='function')render();}).catch(()=>{window.__webTermine=[];window.__webLoading=false;}); }
function calCollect(key,typ){ const base=DB.read(key,[]); return (typ==='mpu'&&Array.isArray(window.__webTermine))?base.concat(webTermineEvents()):base; }
function evClick(key,e){ return e._blocked?'onclick="event.stopPropagation()" title="Belegt – Website-Buchung"':`onclick="event.stopPropagation();editEvent('${key}','${e.id}')"`; }
function evIcon(e){ return e._blocked?'🔒 ':(e.video?'🎥 ':''); }
function calMonth(key,refIso,typ){
  const events=calCollect(key,typ);
  const ref=new Date(refIso+'T00:00'); const y=ref.getFullYear(), mo=ref.getMonth();
  const first=new Date(y,mo,1); const startDow=(first.getDay()+6)%7; const days=new Date(y,mo+1,0).getDate();
  const dows=['Mo','Di','Mi','Do','Fr','Sa','So']; const todayIso=isoIn(0);
  let cells='';
  for(let i=0;i<startDow;i++) cells+='<div></div>';
  for(let d=1;d<=days;d++){
    const iso=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs=events.filter(e=>e.date===iso);
    cells+=`<div class="day ${iso===todayIso?'today':''}" onclick="addEvent('${key}','${iso}')"><div class="num">${d}</div>${evs.map(e=>`<div class="ev" style="background:${calEvColor(e)}" ${evClick(key,e)}>${evIcon(e)}${e.time||''} ${esc(e.title)}${e.firma?` · ${esc(e.firma)}`:''}</div>`).join('')}</div>`;
  }
  return `<div class="cal">${dows.map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>`;
}
function calWeek(key,refIso,single,typ){
  const events=calCollect(key,typ);
  const dows=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
  const shortd=['Mo','Di','Mi','Do','Fr','Sa','So'];
  const ref=new Date(refIso+'T00:00'); let start=new Date(ref);
  if(!single){ const dow=(ref.getDay()+6)%7; start.setDate(ref.getDate()-dow); }
  const nDays=single?1:7; const dcols=[];
  for(let i=0;i<nDays;i++){ const d=new Date(start); d.setDate(start.getDate()+i); dcols.push(d); }
  const todayIso=isoIn(0); const H0=7,H1=20;
  const header=`<div class="wk-corner"></div>`+dcols.map((d,idx)=>`<div class="wk-dh ${isoOf(d)===todayIso?'today':''}">${single?dows[(d.getDay()+6)%7]:shortd[idx]}<span>${d.getDate()}.${d.getMonth()+1}.</span></div>`).join('');
  const evsAt=(d,pred)=>events.filter(e=>e.date===isoOf(d)&&pred(e)).map(e=>`<div class="wk-ev" style="background:${calEvColor(e)}" ${evClick(key,e)}>${evIcon(e)}${e.time?esc(e.time)+' ':''}${esc(e.title)}${e.firma?`<span class="wk-firma"> · ${esc(e.firma)}</span>`:''}</div>`).join('');
  let allday=`<div class="wk-hl">ganztägig</div>`+dcols.map(d=>`<div class="wk-cell" onclick="addEvent('${key}','${isoOf(d)}')">${evsAt(d,e=>!e.time)}</div>`).join('');
  let rows='';
  for(let hh=H0;hh<=H1;hh++){
    const hr=String(hh).padStart(2,'0');
    rows+=`<div class="wk-hl">${hr}:00</div>`+dcols.map(d=>`<div class="wk-cell" onclick="addEvent('${key}','${isoOf(d)}','${hr}:00')">${evsAt(d,e=>e.time&&parseInt(e.time.slice(0,2),10)===hh)}</div>`).join('');
  }
  const cols=single?'70px 1fr':'52px repeat(7,1fr)';
  return `<div class="wk" style="grid-template-columns:${cols}">${header}${allday}${rows}</div>`;
}
function calendarView(key,typ,title,sub){
  ensureCalCss(); if(typ==='mpu') loadWebTermine(); const s=calState(); const ref=new Date(s.ref+'T00:00');
  let label;
  if(s.mode==='month') label=ref.toLocaleDateString('de-DE',{month:'long',year:'numeric'});
  else if(s.mode==='day') label=ref.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
  else { const dow=(ref.getDay()+6)%7; const ws=new Date(ref); ws.setDate(ref.getDate()-dow); const we=new Date(ws); we.setDate(ws.getDate()+6); label=`${ws.getDate()}.${ws.getMonth()+1}. – ${we.getDate()}.${we.getMonth()+1}.${we.getFullYear()}`; }
  const bar=`<div class="calbar"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><button class="btn sm" onclick="calNav(-1)">‹</button><button class="btn sm" onclick="calToday()">Heute</button><button class="btn sm" onclick="calNav(1)">›</button><span class="calttl">${label}</span></div><div style="display:flex;gap:6px"><button class="btn sm ${s.mode==='day'?'active':''}" onclick="setCalMode('day')">Tag</button><button class="btn sm ${s.mode==='week'?'active':''}" onclick="setCalMode('week')">Woche</button><button class="btn sm ${s.mode==='month'?'active':''}" onclick="setCalMode('month')">Monat</button></div></div>`;
  const body = s.mode==='month'?calMonth(key,s.ref,typ):calWeek(key,s.ref,s.mode==='day',typ);
  return head(title,sub,`<button class="btn" onclick="addEvent('${key}')">+ Termin</button>`)+
    (typ==='mb'?`<div class="banner">👔 Dieser Kalender ist <b>auch für den Chef sichtbar</b> – Pflichtfunktion.</div>`:'')+
    `<div class="card">${bar}${body}<p class="muted" style="font-size:12px;margin-top:12px">Slot anklicken, um einen Termin anzulegen.</p></div>`;
}

function permSections(){
  const seen={}; const out=[];
  [['mb','🏭 Maschinenbau'],['mpu','🎓 MPU-Beratung']].forEach(([mask,maskLbl])=>{
    NAV[mask].forEach(it=>{ if(!it.id) return; const key=mask+':'+it.id;
      out.push({mask,maskLbl,id:it.id,label:it.label,ico:it.ico,uniq:key}); });
  });
  return out;
}
function adminView(){
  const perm=getPerm();
  let curMask='';
  const rows=permSections().map(s=>{
    const p=perm[s.id]||{}; const see=p.see!==false; const edit=p.edit!==false;
    const maskHdr = s.maskLbl!==curMask ? (curMask=s.maskLbl, `<tr><td colspan="3" style="padding-top:16px"><b>${s.maskLbl}</b></td></tr>`) : '';
    return `${maskHdr}<tr>
      <td>${s.ico} ${esc(s.label)}</td>
      <td class="right"><label class="chip" style="cursor:pointer"><input type="checkbox" data-pid="${s.id}" data-k="see" ${see?'checked':''} onchange="togglePerm(this)"> sehen</label></td>
      <td class="right"><label class="chip" style="cursor:pointer"><input type="checkbox" data-pid="${s.id}" data-k="edit" ${edit?'checked':''} onchange="togglePerm(this)"> bearbeiten</label></td>
    </tr>`;
  }).join('');
  return head('Berechtigungen','Du legst fest, was dein Mitarbeiter sehen und bearbeiten darf',
    `<button class="btn gray" onclick="setAllPerm(true)">Alles erlauben</button> <button class="btn gray" onclick="setAllPerm(false)">Alles sperren</button>`)+`
    <div class="banner">ℹ️ Diese Rechte gelten für den <b>Mitarbeiter</b>. Als <b>Chef</b> siehst und bearbeitest du immer alles. „Sehen" aus = Bereich ist für den Mitarbeiter komplett ausgeblendet. „Bearbeiten" aus = er kann den Bereich öffnen, aber nichts ändern (nur Ansicht).</div>
    <div class="card" style="padding:0;overflow:hidden"><table>
      <thead><tr><th>Bereich</th><th class="right">Sehen</th><th class="right">Bearbeiten</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="card" style="margin-top:16px">
      <h3 style="margin-top:0">Mitarbeiter-Passwort zurücksetzen</h3>
      <p class="muted" style="font-size:12px">Setzt das Login-Passwort des Mitarbeiters neu.</p>
      <div class="row" style="align-items:flex-end"><div class="field" style="max-width:240px;margin:0"><label>Neues Passwort</label><input id="ma_pw" placeholder="neues Passwort"></div>
      <button class="btn" onclick="resetMaPw()">Setzen</button></div>
    </div>`;
}
function togglePerm(el){
  const perm=getPerm(); const id=el.dataset.pid; const k=el.dataset.k;
  perm[id]=perm[id]||{}; perm[id][k]=el.checked;
  if(k==='see' && !el.checked) perm[id].edit=false; // ohne Sehen kein Bearbeiten
  DB.write('permissions',perm); render();
}
function setAllPerm(val){
  const perm={}; permSections().forEach(s=>{ perm[s.id]={see:val,edit:val}; });
  DB.write('permissions',perm); render();
}
function resetMaPw(){
  const v=document.getElementById('ma_pw').value.trim(); if(!v){alert('Bitte Passwort eingeben.');return;}
  DB.write('pw_Mitarbeiter',v); document.getElementById('ma_pw').value=''; alert('Mitarbeiter-Passwort gesetzt.');
}

    <div class="cards grid-2">${panels}</div>`;
}
function saveAvail(role){
